          <div class="content">
            ${fromConfirm ? `
            <div style="background:var(--success-bg);border:1px solid var(--success);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;text-align:center">
              <div style="font-size:20px">✓</div>
              <div style="font-weight:700;color:var(--success);margin-top:2px">Informe confirmado</div>
              <div style="font-size:13px;color:var(--text-2);margin-top:4px">El stock fue descontado automáticamente</div>
            </div>` : ''}
            <div class="preview-meta">
              <div class="preview-meta__turno">${turnoLabel}</div>
              <div class="preview-meta__fecha">${fmtFecha(informe.fecha)}</div>
              <div class="preview-meta__user">Confirmado por ${informe.confirmedByNombre} · ${fmtDateTime(informe.confirmedAt)}</div>
            </div>

            <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px">
              <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px">Resumen por estilo</div>
              ${resumenEstilosHTML}
              <div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-top:2px">
                <span style="font-weight:600;color:var(--text)">Total botellas</span>
                <span style="font-size:18px;font-weight:800;color:var(--gold)">${totalBot}</span>
              </div>
              ${hayPreciosEstimados ? `
              <div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--border);margin-top:8px">
                <span style="font-size:13px;color:var(--text-muted)">Facturación estimada <span style="font-size:11px">(precio carta)</span></span>
                <span style="font-size:16px;font-weight:700;color:var(--gold-light)">${fmtCurrency(totalEstimado)}</span>
              </div>` : ''}
            </div>

            <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px">Detalle</div>
            <div class="preview-groups">${groupsHTML}</div>
            ${edicionesHTML}
          </div>
        </div>`,
      bind() {
        document.getElementById('btn-back').onclick = () => Router.back();
        if (canEdit) {
          document.getElementById('btn-reabrir').onclick = () => {
            // Revertir stock: deshacer las salidas del informe antes de reabrir
            // Esto previene la doble-deducción cuando se re-confirme el informe editado.
            informe.items.forEach(item => {
              const wine = DB.getWineById(item.vinoId);
              if (wine) {
                DB.updateWine(wine.id, { stock_actual: (wine.stock_actual || 0) + item.cantidad });
                DB.addMovement({
                  wineId:   wine.id,
                  tipo:     'reversal',
                  cantidad: item.cantidad,
                  userId:   Auth.user.id,
                  userName: Auth.user.nombre,
                  nota:     `Corrección: informe reabierto para edición`,
                });
              }
            });

            // Registrar inicio de edición
            const ediciones = informe.ediciones || [];
            ediciones.push({ userId: Auth.user.id, userName: Auth.user.nombre, fecha: now(), nota: 'Informe reabierto para edición' });
            DB.updateInforme(id, { estado: 'en_progreso', ediciones });
            Router.go('informe-form', { informeId: id });
          };
        }
      },
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: PROVEEDORES (listado)
  ═══════════════════════════════════════════════════════════════════ */
  function pageProveedores() {
    const proveedores = DB.getProveedores().filter(p => p.activo !== false);

    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">Proveedores</span>
            <span></span>
          </header>
          <div class="content content--with-fab">
            <div class="search-bar">
              <input class="search-bar__input" id="inp-search" type="search" placeholder="Buscar proveedor…" autocomplete="off">
            </div>
            <div id="prov-list">
              ${proveedores.length
                ? proveedores.map(p => {
                    const facturas = DB.getIngresos().filter(i => i.proveedorId === p.id && i.estado === 'confirmado').length;
                    return `
                      <button class="prov-item" data-id="${p.id}" style="flex-direction:column;align-items:flex-start;padding:12px 14px;gap:4px">
                        <span style="font-weight:600">${escHtml(p.nombre)}</span>
                        <span style="font-size:12px;color:var(--text-muted)">${p.cuit ? `CUIT ${p.cuit} · ` : ''}${facturas} factura${facturas !== 1 ? 's' : ''}</span>
                      </button>`;
                  }).join('')
                : `<div class="empty-state"><p>Sin proveedores registrados</p></div>`}
            </div>
          </div>
          <button class="fab" id="btn-nuevo">+</button>
        </div>`,
      bind() {
        document.getElementById('btn-back').onclick  = () => Router.back();
        document.getElementById('btn-nuevo').onclick = () => Router.go('proveedor-form', { mode: 'create' });

        document.getElementById('inp-search').oninput = e => {
          const q = normalize(e.target.value);
          document.querySelectorAll('#prov-list .prov-item').forEach(btn => {
            btn.style.display = normalize(btn.querySelector('span').textContent).includes(q) ? '' : 'none';
          });
        };

        document.querySelectorAll('#prov-list .prov-item').forEach(btn => {
          btn.onclick = () => Router.go('proveedor-detail', { id: btn.dataset.id });
        });
      },
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: PROVEEDOR FORM (alta + edición)
  ═══════════════════════════════════════════════════════════════════ */
  function pageProveedorForm() {
    const { mode, id, returnTo, prefill } = Router.params;
    const isEdit = mode === 'edit';
    const p      = isEdit ? DB.getProveedorById(id) : null;

    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">${isEdit ? 'Editar Proveedor' : 'Nuevo Proveedor'}</span>
            <span></span>
          </header>
          <div class="content">
            <div class="prov-duplicate-warn" id="dup-warn">
              ⚠️ Ya existe un proveedor con nombre similar: <span id="dup-name"></span>
            </div>
            <div class="field-group">
              <label class="field-label">Razón social <span style="color:var(--error)">*</span></label>
              <input class="field-input" id="inp-nombre" type="text" placeholder="Ej: Bodegas Catena Zapata S.A." value="${escHtml(p?.nombre || prefill || '')}" autocomplete="off">
            </div>
            <div class="field-group">
              <label class="field-label">Nombre fantasía <span style="color:var(--text-muted);font-size:11px;font-weight:400">(cómo se conoce)</span></label>
              <input class="field-input" id="inp-fantasia" type="text" placeholder="Ej: Catena Zapata" value="${escHtml(p?.nombre_fantasia || '')}">
            </div>
            <div class="field-group">
              <label class="field-label">CUIT</label>
              <input class="field-input" id="inp-cuit" type="text" placeholder="Ej: 30-12345678-9" value="${escHtml(p?.cuit || '')}">
            </div>
            <div style="margin:14px 0 6px;font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em">Contacto comercial</div>
            <div class="field-group">
              <label class="field-label">Nombre del vendedor / contacto</label>
              <input class="field-input" id="inp-contacto" type="text" placeholder="Ej: Martín López" value="${escHtml(p?.nombre_contacto || '')}">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
              <div class="field-group">
                <label class="field-label">Teléfono</label>
                <input class="field-input" id="inp-tel" type="tel" placeholder="Ej: 261 4123456" value="${escHtml(p?.telefono || '')}">
              </div>
              <div class="field-group">
                <label class="field-label">Email</label>
                <input class="field-input" id="inp-email" type="email" placeholder="contacto@prov.com" value="${escHtml(p?.email || '')}">
              </div>
            </div>
            <div class="field-group">
              <label class="field-label">Condiciones de pago</label>
              <input class="field-input" id="inp-condpago" type="text" placeholder="Ej: 30 días, contado con 5% desc." value="${escHtml(p?.condiciones_pago || '')}">
            </div>
            <div class="field-group">
              <label class="field-label">Notas</label>
              <textarea class="field-input" id="inp-notas" rows="2" placeholder="Observaciones adicionales…" style="resize:none">${escHtml(p?.notas || '')}</textarea>
            </div>
            <button class="btn btn--primary" id="btn-save" style="width:100%;margin-top:8px">${isEdit ? 'Guardar cambios' : 'Crear proveedor'}</button>
            ${isEdit ? `
            <button class="btn btn--outline" id="btn-baja" style="width:100%;margin-top:10px;color:var(--error);border-color:var(--error)">Dar de baja</button>
            <div id="baja-confirm" style="display:none;background:var(--error-bg);border:1px solid var(--error);border-radius:var(--radius-sm);padding:12px;margin-top:8px;font-size:13px;color:var(--text)">
              ¿Dar de baja este proveedor? El historial de facturas se conserva.
              <div style="display:flex;gap:8px;margin-top:10px">
                <button class="btn btn--primary" id="btn-baja-ok" style="flex:1;background:var(--error);border-color:var(--error)">Confirmar</button>
                <button class="btn btn--outline" id="btn-baja-cancel" style="flex:1">Cancelar</button>
              </div>
            </div>` : ''}
          </div>
        </div>`,
      bind() {
        document.getElementById('btn-back').onclick = () => Router.back();

        // Duplicate check on nombre blur
        document.getElementById('inp-nombre').onblur = function() {
          const q     = normalize(this.value.trim());
          if (!q) return;
          const dupes = DB.getProveedores().filter(x =>
            normalize(x.nombre).includes(q) && x.activo !== false && (!isEdit || x.id !== id)
          );
          const warn = document.getElementById('dup-warn');
          const nameEl = document.getElementById('dup-name');
          if (dupes.length) {
            nameEl.textContent = dupes[0].nombre;
            warn.style.display = '';
          } else {
            warn.style.display = 'none';
          }
        };

        document.getElementById('btn-save').onclick = () => {
          const nombre = document.getElementById('inp-nombre').value.trim();
          if (!nombre) { Toast.show('La razón social es requerida', 'error'); return; }

          const data = {
            nombre,
            nombre_fantasia:  document.getElementById('inp-fantasia').value.trim(),
            nombre_contacto:  document.getElementById('inp-contacto').value.trim(),
            cuit:             document.getElementById('inp-cuit').value.trim(),
            telefono:         document.getElementById('inp-tel').value.trim(),
            email:            document.getElementById('inp-email').value.trim(),
            condiciones_pago: document.getElementById('inp-condpago').value.trim(),
            notas:            document.getElementById('inp-notas').value.trim(),
            activo:           true,
          };

          if (isEdit) {
            DB.updateProveedor(id, data);
            Toast.show('Proveedor actualizado', 'success');
            Router.back();
          } else {
            const nuevo = DB.addProveedor({ id: uid(), ...data, creadoEn: now(), creadoPor: Auth.user.id });
            Toast.show('Proveedor creado ✓', 'success');
            // Si viene desde el flujo de ingreso, arranca ingreso directo
            if (returnTo === 'ingreso') {
              const ing = DB.addIngreso({
                id: uid(), proveedorId: nuevo.id, nroFactura: '', fecha: now(),
                items: [], estado: 'en_progreso',
                creadoPor: Auth.user.id, creadoEn: now(), correcciones: [],
              });
              Router.go('ingreso-form', { ingresoId: ing.id });
            } else {
              Router.go('proveedor-detail', { id: nuevo.id });
            }
          }
        };

        const btnBaja = document.getElementById('btn-baja');
        if (btnBaja) {
          btnBaja.onclick = () => {
            document.getElementById('baja-confirm').style.display = '';
            btnBaja.style.display = 'none';
          };
          document.getElementById('btn-baja-cancel').onclick = () => {
            document.getElementById('baja-confirm').style.display = 'none';
            btnBaja.style.display = '';
          };
          document.getElementById('btn-baja-ok').onclick = () => {
            DB.updateProveedor(id, { activo: false });
            Toast.show('Proveedor dado de baja', 'success');
            Router.go('proveedores');
          };
        }
      },
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: PROVEEDOR DETAIL (ficha)
  ═══════════════════════════════════════════════════════════════════ */
  function pageProveedorDetail() {
    const { id } = Router.params;
    const p = DB.getProveedorById(id);
    if (!p) { Router.go('proveedores'); return { html: '', bind() {} }; }

    const ingresos     = DB.getIngresos().filter(i => i.proveedorId === id && i.estado === 'confirmado');
    const totalCompras = ingresos.reduce((s, i) => s + (i.items || []).reduce((a, x) => a + x.precioUnitario * x.cantidad, 0), 0);

    const ingresosHTML = ingresos.length
      ? ingresos.slice().reverse().map(i => {
          const total = (i.items || []).reduce((s, x) => s + x.precioUnitario * x.cantidad, 0);
          return `
            <button class="ingreso-card" data-id="${i.id}">
              <div class="ingreso-card__row">
                <span>Nº ${i.nroFactura || '—'}</span>
                <span class="ingreso-card__total">${fmtCurrency(total)}</span>
              </div>
              <div class="ingreso-card__row ingreso-card__row--meta">
                <span>${fmtDate(i.fecha)}</span>
                <span>${(i.items || []).length} ítems</span>
              </div>
            </button>`;
        }).join('')
      : `<div class="empty-state"><p>Sin facturas registradas</p></div>`;

    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">${escHtml(p.nombre)}</span>
            ${Auth.can('manage_stock') ? `<button class="topbar__action" id="btn-edit">Editar</button>` : '<span></span>'}
          </header>
          <div class="content">
            <div class="prov-ficha">
              <div class="prov-ficha__name">${escHtml(p.nombre)}</div>
              ${p.nombre_fantasia ? `<div style="font-size:13px;color:var(--gold);margin-top:2px">${escHtml(p.nombre_fantasia)}</div>` : ''}
              ${p.cuit            ? `<div class="prov-ficha__cuit">CUIT ${escHtml(p.cuit)}</div>` : ''}
              ${(p.nombre_contacto || p.telefono || p.email) ? `
              <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
                ${p.nombre_contacto ? `<div style="font-size:13px;color:var(--text-2);margin-bottom:4px">👤 ${escHtml(p.nombre_contacto)}</div>` : ''}
                ${p.telefono        ? `<div style="font-size:13px;color:var(--text-2)">📞 ${escHtml(p.telefono)}</div>` : ''}
                ${p.email           ? `<div style="font-size:13px;color:var(--text-2)">✉️ ${escHtml(p.email)}</div>` : ''}
              </div>` : ''}
              ${p.condiciones_pago ? `<div style="font-size:12px;color:var(--text-muted);margin-top:8px">💳 ${escHtml(p.condiciones_pago)}</div>` : ''}
              ${p.notas            ? `<div style="font-size:13px;color:var(--text-muted);margin-top:8px;border-top:1px solid var(--border);padding-top:8px">${escHtml(p.notas)}</div>` : ''}
            </div>

            <div class="prov-stats">
              <div class="prov-stat">
                <div class="prov-stat__val">${ingresos.length}</div>
                <div class="prov-stat__label">Facturas</div>
              </div>
              <div class="prov-stat">
                <div class="prov-stat__val">${fmtCurrency(totalCompras)}</div>
                <div class="prov-stat__label">Total compras</div>
              </div>
            </div>

            <div style="font-weight:600;margin-bottom:8px">Facturas</div>
            ${ingresosHTML}
          </div>
        </div>`,
      bind() {
        document.getElementById('btn-back').onclick = () => Router.back();
        const btnEdit = document.getElementById('btn-edit');
        if (btnEdit) btnEdit.onclick = () => Router.go('proveedor-form', { mode: 'edit', id });
        document.querySelectorAll('.ingreso-card').forEach(c => {
          c.onclick = () => Router.go('ingreso-detail', { ingresoId: c.dataset.id });
        });
      },
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: INGRESOS (listado histórico)
  ═══════════════════════════════════════════════════════════════════ */
  function pageIngresos() {
    const ingresos   = DB.getIngresos().slice().reverse();
    const enProgreso = DB.getIngresoEnProgreso();
    // Ingreso en progreso sin ítems = "huérfano" — bloquea creación sin motivo útil
    const esHuerfano = enProgreso && (!enProgreso.items || enProgreso.items.length === 0);

    const listHTML = ingresos.length
      ? ingresos.map(i => {
          const prov  = DB.getProveedorById(i.proveedorId);
          const label = i.estado === 'en_progreso'
            ? `<span class="badge badge--warning">En progreso</span>`
            : `<span class="badge badge--success">Confirmado</span>`;
          const items = i.items || [];
          const total = items.reduce((s, x) => s + (x.precioUnitario * x.cantidad), 0);
          return `
            <button class="ingreso-card" data-id="${i.id}">
              <div class="ingreso-card__row">
                <span class="ingreso-card__prov">${prov ? prov.nombre : 'Proveedor eliminado'}</span>
                ${label}
              </div>
              <div class="ingreso-card__row ingreso-card__row--meta">
                <span>${fmtDate(i.fecha)}</span>
                <span class="ingreso-card__total">${fmtCurrency(total)}</span>
              </div>
              <div class="ingreso-card__row ingreso-card__row--meta">
                <span>${items.length} ítem${items.length !== 1 ? 's' : ''} · Nº ${i.nroFactura || '—'}</span>
              </div>
            </button>`;
        }).join('')
      : `<div class="empty-state"><p>No hay ingresos registrados</p></div>`;

    const provEnProg = enProgreso ? DB.getProveedorById(enProgreso.proveedorId) : null;

    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">Ingresos de Mercadería</span>
            <span></span>
          </header>
          <div class="content content--with-fab">

            ${enProgreso && !esHuerfano ? `
            <div class="in-progress-banner" id="btn-continue-ing" style="margin-bottom:12px">
              <div>
                <div class="in-progress-banner__title">Ingreso en progreso</div>
                <div class="in-progress-banner__meta">${provEnProg ? provEnProg.nombre : '—'} · ${(enProgreso.items||[]).length} ítems cargados</div>
              </div>
              <span class="in-progress-banner__arrow">→</span>
            </div>` : ''}

            ${esHuerfano ? `
            <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:12px;font-size:13px;color:var(--text)">
              <div style="font-weight:600;margin-bottom:4px">Hay un ingreso vacío sin completar</div>
              <div style="color:var(--text-muted);margin-bottom:10px">${provEnProg ? provEnProg.nombre : '—'} — sin ítems cargados</div>
              <div style="display:flex;gap:8px">
                <button class="btn btn--primary btn--sm" id="btn-retomar-huerfano" style="flex:1">Continuar</button>
                <button class="btn btn--outline btn--sm" id="btn-descartar-huerfano" style="flex:1;color:var(--error);border-color:var(--error)">Descartar</button>
              </div>
            </div>` : ''}

            ${listHTML}
          </div>
          ${(!enProgreso || esHuerfano) ? `<button class="fab" id="btn-nuevo">+</button>` : ''}
        </div>`,
      bind() {
        document.getElementById('btn-back').onclick = () => Router.back();

        const btnCont = document.getElementById('btn-continue-ing');
        if (btnCont) btnCont.onclick = () => Router.go('ingreso-form', { ingresoId: enProgreso.id });

        const btnRetomar = document.getElementById('btn-retomar-huerfano');
        if (btnRetomar) btnRetomar.onclick = () => Router.go('ingreso-form', { ingresoId: enProgreso.id });

        const btnDescartar = document.getElementById('btn-descartar-huerfano');
        if (btnDescartar) btnDescartar.onclick = () => {
          DB.saveIngresos(DB.getIngresos().filter(i => i.id !== enProgreso.id));
          Toast.info('Ingreso vacío descartado');
          App.render();
        };

        document.querySelectorAll('.ingreso-card').forEach(c => {
          c.onclick = () => {
            const ing = DB.getIngresoById(c.dataset.id);
            if (ing.estado === 'en_progreso') Router.go('ingreso-form', { ingresoId: ing.id });
            else Router.go('ingreso-detail', { ingresoId: ing.id });
          };
        });
        const btnNuevo = document.getElementById('btn-nuevo');
        if (btnNuevo) btnNuevo.onclick = () => Router.go('ingreso-proveedor');
      },
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: INGRESO – SELECCIÓN DE PROVEEDOR
  ═══════════════════════════════════════════════════════════════════ */
  function pageIngresoProveedor() {
    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">Nuevo Ingreso</span>
            <span></span>
          </header>
          <div class="content">
            <p style="padding:16px 0 8px;color:var(--text-2);font-size:14px;">¿De qué proveedor es la factura?</p>
            <div class="prov-search-wrap">
              <input class="search-bar__input" id="inp-prov" type="search" placeholder="Buscar proveedor…" autocomplete="off" style="width:100%">
            </div>
            <div class="prov-list" id="prov-list"></div>
            <div class="prov-create-box" id="prov-create-box" style="display:none">
              <button class="btn btn--outline" id="btn-create-prov" style="width:100%;margin-top:4px"></button>
            </div>
          </div>
        </div>`,
      bind() {
        document.getElementById('btn-back').onclick = () => Router.back();

        const renderProvList = (query) => {
          const q     = normalize(query);
          const provs = DB.getProveedores()
            .filter(p => p.activo !== false && normalize(p.nombre).includes(q));
          const list  = document.getElementById('prov-list');
          const box   = document.getElementById('prov-create-box');
          const btn   = document.getElementById('btn-create-prov');

          list.innerHTML = provs.map(p => `
            <button class="prov-item" data-id="${p.id}">
              <span>${escHtml(p.nombre)}</span>
              ${p.cuit ? `<span style="font-size:12px;color:var(--text-muted)">CUIT ${escHtml(p.cuit)}</span>` : ''}
            </button>`).join('') || (q.length === 0 ? `<div class="empty-state" style="padding:24px 0"><p>No hay proveedores. Creá el primero.</p></div>` : '');

          const exactMatch = provs.some(p => normalize(p.nombre) === q);
          if (!exactMatch) {
            btn.textContent = query.trim() ? `+ Crear proveedor "${query.trim()}"` : '+ Crear nuevo proveedor';
            box.style.display = '';
            btn.onclick = () => Router.go('proveedor-form', {
              mode: 'create',
              returnTo: 'ingreso',
              ...(query.trim() ? { prefill: query.trim() } : {}),
            });
          } else {
            box.style.display = 'none';
          }

          list.querySelectorAll('.prov-item').forEach(b => {
            b.onclick = () => {
              const ing = DB.addIngreso({
                id: uid(), proveedorId: b.dataset.id, nroFactura: '', fecha: now(),
                items: [], estado: 'en_progreso',
                creadoPor: Auth.user.id, creadoEn: now(), correcciones: [],
              });
              Router.go('ingreso-form', { ingresoId: ing.id });
            };
          });
        };

        renderProvList('');
        document.getElementById('inp-prov').oninput = e => renderProvList(e.target.value);
      },
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: INGRESO – FORMULARIO (carga de ítems)
  ═══════════════════════════════════════════════════════════════════ */
  function pageIngresoForm() {
    const { ingresoId } = Router.params;
    const ing    = DB.getIngresoById(ingresoId);
    if (!ing) { Router.go('ingresos'); return { html: '', bind() {} }; }
    const prov   = DB.getProveedorById(ing.proveedorId);
    const wines  = DB.getWines().filter(w => w.activo !== false);

    function renderItems() {
      const cont = document.getElementById('ingreso-items');
      if (!cont) return;
      const items = DB.getIngresoById(ingresoId).items || [];
      if (!items.length) {
        cont.innerHTML = `<div class="empty-state" style="padding:24px 0"><p>Sin ítems. Agregá vinos de la factura.</p></div>`;
        return;
      }
      cont.innerHTML = items.map((it, idx) => {
        const w = DB.getWineById ? wines.find(w => w.id === it.wineId) : wines.find(w => w.id === it.wineId);
        const name = w ? `${w.nombre} ${w.añada}` : it.wineNombre;
        return `
          <div class="ingreso-item" data-idx="${idx}">
            <div class="ingreso-item__main">
              <span class="ingreso-item__name">${name}</span>
              ${it.isNew ? `<span class="new-wine-tag">Nuevo</span>` : ''}
              ${it.costoActualizado ? `<span class="cost-change-alert">Costo actualizado</span>` : ''}
            </div>
            <div class="ingreso-item__meta">
              <span>${it.cantidad} bot.</span>
              <span>${fmtCurrency(it.precioUnitario)} c/u</span>
              <button class="btn-icon btn--danger" data-remove="${idx}">✕</button>
            </div>
          </div>`;
      }).join('');

      cont.querySelectorAll('[data-remove]').forEach(btn => {
        btn.onclick = () => {
          const current = DB.getIngresoById(ingresoId);
          const updated = current.items.filter((_, i) => i !== parseInt(btn.dataset.remove));
          DB.updateIngreso(ingresoId, { items: updated });
          renderItems();
          updateTotal();
        };
      });
    }

    function updateTotal() {
      const el = document.getElementById('ingreso-total');
      if (!el) return;
      const items = DB.getIngresoById(ingresoId).items || [];
      const total = items.reduce((s, x) => s + (x.precioUnitario * x.cantidad), 0);
      el.textContent = fmtCurrency(total);
    }

    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">${prov ? prov.nombre : 'Ingreso'}</span>
            <span></span>
          </header>
          <div class="content content--with-fab">
            <div class="ingreso-selected-card">
              <div style="display:flex;gap:12px;align-items:flex-start">
                <div style="flex:1">
                  <label class="field-label">Nº de Factura</label>
                  <input class="field-input" id="inp-factura" type="text" placeholder="Ej: 0001-00012345" value="${escHtml(ing.nroFactura || '')}">
                  <div id="factura-dup-warn" style="display:none;font-size:12px;color:var(--warning);margin-top:4px">⚠️ Ya existe una factura con ese número para este proveedor</div>
                </div>
                <div style="flex:1">
                  <label class="field-label">Fecha</label>
                  <input class="field-input" id="inp-fecha" type="date" value="${ing.fecha ? ing.fecha.split('T')[0] : new Date().toISOString().split('T')[0]}">
                </div>
              </div>
            </div>

            <div style="margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center">
              <span style="font-weight:600;font-size:15px">Ítems</span>
              <span style="color:var(--text-2);font-size:13px">Total: <strong id="ingreso-total">$0</strong></span>
            </div>
            <div id="ingreso-items"></div>

            <div style="margin-top:16px">
              <label class="field-label">Agregar vino</label>
              <div class="prov-search-wrap">
                <input class="search-bar__input" id="inp-wine-search" type="search" placeholder="Buscar vino por nombre…" autocomplete="off" style="width:100%">
              </div>
              <div class="prov-list" id="wine-search-results"></div>
            </div>

            <div id="add-item-form" style="display:none;margin-top:8px">
              <div id="add-item-content"></div>
            </div>
          </div>
          <button class="fab" id="btn-preview" style="background:var(--success)" title="Vista previa">✓</button>
        </div>`,
      bind() {
        document.getElementById('btn-back').onclick = () => {
          // Save factura/fecha before leaving
          DB.updateIngreso(ingresoId, {
            nroFactura: document.getElementById('inp-factura').value.trim(),
            fecha: document.getElementById('inp-fecha').value,
          });
          Router.back();
        };

        // Validar factura duplicada al salir del campo
        document.getElementById('inp-factura').onblur = function() {
          const nro = this.value.trim();
          const warn = document.getElementById('factura-dup-warn');
          if (!nro) { warn.style.display = 'none'; return; }
          const dup = DB.getIngresos().some(i =>
            i.id !== ingresoId &&
            i.proveedorId === ing.proveedorId &&
            i.estado === 'confirmado' &&
            i.nroFactura === nro
          );
          warn.style.display = dup ? '' : 'none';
        };

        document.getElementById('btn-preview').onclick = () => {
          DB.updateIngreso(ingresoId, {
            nroFactura: document.getElementById('inp-factura').value.trim(),
            fecha: document.getElementById('inp-fecha').value,
          });
          const items = DB.getIngresoById(ingresoId).items || [];
          if (!items.length) { Toast.show('Agregá al menos un ítem', 'error'); return; }
          Router.go('ingreso-preview', { ingresoId });
        };

        renderItems();
        updateTotal();

        // Wine search
        document.getElementById('inp-wine-search').oninput = function() {
          const q       = normalize(this.value);
          const results = document.getElementById('wine-search-results');
          const addForm = document.getElementById('add-item-form');

          if (q.length < 1) { results.innerHTML = ''; addForm.style.display = 'none'; return; }

          const matches = wines.filter(w => normalize(w.nombre + ' ' + w.añada).includes(q));
          const exactMatch = wines.some(w => normalize(w.nombre) === q);

          results.innerHTML = matches.map(w => `
            <button class="prov-item" data-wine-id="${w.id}">
              ${w.nombre} ${w.añada} ${typeBadge(w.tipo)}
            </button>`).join('');

          if (q.length >= 2 && !exactMatch) {
            results.innerHTML += `<button class="prov-item prov-item--new" id="btn-wine-nuevo">+ Crear vino "${this.value.trim()}"</button>`;
          }

          results.querySelectorAll('[data-wine-id]').forEach(btn => {
            btn.onclick = () => showItemForm(btn.dataset.wineId, null, this.value);
          });

          const btnNuevo = document.getElementById('btn-wine-nuevo');
          if (btnNuevo) {
            btnNuevo.onclick = () => showItemForm(null, this.value.trim(), this.value.trim());
          }
        };

        function showItemForm(wineId, newWineName, searchVal) {
          const addForm    = document.getElementById('add-item-form');
          const addContent = document.getElementById('add-item-content');
          addForm.style.display = '';

          let costoDefault = '';
          let costoHint    = '';
          let isNew        = !wineId;

          const canEditCost = isNew || Auth.can('edit_cost');

          let stockInfo = '';
          if (wineId) {
            const w = wines.find(w => w.id === wineId);
            costoDefault = w ? w.costo : '';
            costoHint    = w && w.costo
              ? (canEditCost
                  ? `Costo actual: ${fmtCurrency(w.costo)}`
                  : `Costo registrado: ${fmtCurrency(w.costo)} (sin permiso para modificar)`)
              : '';
            if (w) {
              const s = w.stock_actual ?? 0;
              const sc = s === 0 ? 'var(--error)' : s <= 3 ? 'var(--warning)' : 'var(--success)';
              stockInfo = `<div style="font-size:12px;margin-bottom:10px;color:var(--text-2)">Stock actual: <strong style="color:${sc}">${s} bot.</strong></div>`;
            }
          }

          addContent.innerHTML = `
            <div style="background:var(--surface-2);border-radius:var(--radius);padding:14px;border:1px solid var(--border)">
              ${stockInfo}
              ${isNew ? `
                <div class="field-group" style="margin-bottom:10px">
                  <label class="field-label">Tipo de vino <span style="color:var(--error)">*</span></label>
                  <select class="field-input" id="new-wine-tipo">
                    <option value="">— Seleccioná —</option>
                    ${DB.getWineTypes().map(t => `<option value="${t}">${t}</option>`).join('')}
                  </select>
                </div>
                <div class="field-group" style="margin-bottom:10px">
                  <label class="field-label">Nombre <span style="color:var(--error)">*</span></label>
                  <input class="field-input" id="new-wine-nombre" type="text" value="${escHtml(newWineName || '')}" placeholder="Nombre del vino">
                </div>
                <div style="display:flex;gap:10px;margin-bottom:10px">
                  <div class="field-group" style="flex:1">
                    <label class="field-label">Añada</label>
                    <input class="field-input" id="new-wine-anada" type="text" placeholder="Ej: 2022 o S/A">
                  </div>
                  <div class="field-group" style="flex:1">
                    <label class="field-label">Precio carta <span style="color:var(--text-muted);font-size:11px">(opcional)</span></label>
                    <input class="field-input" id="new-wine-precio" type="number" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
                    <span style="font-size:11px;color:var(--text-muted)">Podés asignarlo después</span>
                  </div>
                </div>` : ''}
              <div style="margin-bottom:10px">
                <label class="field-label">Cantidad</label>
                <div id="ing-modo-botellas">
                  <input class="field-input" id="inp-cantidad" type="number" min="1" placeholder="0" inputmode="numeric">
                </div>
                <div id="ing-modo-cajas" style="display:none">
                  <div style="display:flex;align-items:center;gap:8px">
                    <input class="field-input" id="inp-ing-cajas" type="number" min="1" value="1" inputmode="numeric" style="flex:1;text-align:center">
                    <span style="color:var(--text-2);font-size:13px;white-space:nowrap">cajas ×</span>
                    <input class="field-input" id="inp-ing-bot-caja" type="number" min="1" value="6" inputmode="numeric" style="flex:1;text-align:center">
                    <span style="color:var(--text-2);font-size:13px;white-space:nowrap">bot/caja</span>
                  </div>
                  <div style="margin-top:4px;font-size:13px;color:var(--text-2);text-align:right">
                    Total: <strong id="ing-cajas-total" style="color:var(--gold)">6</strong> bot.
                  </div>
                </div>
                <label style="display:flex;align-items:center;gap:6px;margin-top:8px;cursor:pointer">
                  <input type="checkbox" id="chk-ing-cajas" style="accent-color:var(--gold)">
                  <span style="font-size:12px;color:var(--text-2)">Ingresar por cajas</span>
                </label>
              </div>
              <div class="field-group" style="margin-bottom:10px">
                <label class="field-label">Costo unitario${canEditCost ? '' : ' <span style="color:var(--text-muted)">🔒</span>'}</label>
                <input class="field-input" id="inp-costo" type="number" min="0" step="0.01"
                  value="${costoDefault}" placeholder="0.00" inputmode="decimal"
                  ${!canEditCost ? 'disabled' : ''}>
                ${costoHint ? `<span style="font-size:12px;color:var(--text-muted)">${costoHint}</span>` : ''}
              </div>
              <button class="btn btn--primary" id="btn-add-item" style="width:100%">Agregar ítem</button>
            </div>`;

          // Cajas toggle en ingreso form
          const chkIngCajas = document.getElementById('chk-ing-cajas');
          const calcIngCajas = () => {
            const c = Math.max(1, parseInt(document.getElementById('inp-ing-cajas').value) || 1);
            const b = Math.max(1, parseInt(document.getElementById('inp-ing-bot-caja').value) || 1);
            document.getElementById('ing-cajas-total').textContent = c * b;
          };
          chkIngCajas.onchange = e => {
            document.getElementById('ing-modo-botellas').style.display = e.target.checked ? 'none' : '';
            document.getElementById('ing-modo-cajas').style.display    = e.target.checked ? '' : 'none';
          };
          document.getElementById('inp-ing-cajas').oninput    = calcIngCajas;
          document.getElementById('inp-ing-bot-caja').oninput = calcIngCajas;

          document.getElementById('btn-add-item').onclick = () => {
            const usaCajas = document.getElementById('chk-ing-cajas').checked;
            const cantVal  = usaCajas
              ? Math.max(1, parseInt(document.getElementById('inp-ing-cajas').value)||1) * Math.max(1, parseInt(document.getElementById('inp-ing-bot-caja').value)||1)
              : parseInt(document.getElementById('inp-cantidad').value);
            const costo   = canEditCost
              ? parseFloat(document.getElementById('inp-costo').value)
              : (wines.find(w => w.id === wineId)?.costo || 0);

            if (!cantVal || cantVal < 1) { Toast.show('Cantidad inválida', 'error'); return; }
            if (!costo || costo <= 0)   { Toast.show('Costo inválido', 'error'); return; }

            let finalWineId   = wineId;
            let finalNombre   = '';
            let costoAnterior = null;
            let costoActualizado = false;
            let isNewWine     = !wineId;

            if (isNew) {
              const tipo        = document.getElementById('new-wine-tipo').value;
              const nombre      = document.getElementById('new-wine-nombre').value.trim();
              const añada       = document.getElementById('new-wine-anada').value.trim();
              const precioCarta = parseFloat(document.getElementById('new-wine-precio')?.value) || 0;
              if (!nombre) { Toast.show('El nombre es requerido', 'error'); return; }
              if (!tipo)   { Toast.show('Seleccioná un tipo', 'error'); return; }
              const nuevoVino = DB.addWine({
                id: uid(), nombre, añada: añada || 'S/A', tipo, costo,
                precio_carta: precioCarta,
                stock_actual: 0, activo: true, createdAt: now(), createdBy: Auth.user.id,
              });
              finalWineId  = nuevoVino.id;
              finalNombre  = `${nombre} ${añada || 'S/A'}`;
              isNewWine    = true;
              if (precioCarta === 0) {
                Toast.info(`"${nombre}" creado sin precio de carta — recordá asignarlo en Stock`);
              }
            } else {
              const w = wines.find(w => w.id === wineId);
              finalNombre  = w ? `${w.nombre} ${w.añada}` : '';
              costoAnterior = w ? w.costo : null;
              if (w && costo !== w.costo) {
                if (Auth.can('edit_cost')) {
                  DB.updateWine(w.id, { costo });
                  costoActualizado = true;
                }
              }
            }

            const current = DB.getIngresoById(ingresoId);
            const newItem = {
              wineId: finalWineId, wineNombre: finalNombre,
              cantidad: cantVal, precioUnitario: costo,
              costoAnterior, costoActualizado, isNew: isNewWine,
            };
            DB.updateIngreso(ingresoId, { items: [...(current.items || []), newItem] });

            // Reset form
            addForm.style.display = 'none';
            document.getElementById('wine-search-results').innerHTML = '';
            document.getElementById('inp-wine-search').value = '';
            renderItems();
            updateTotal();
          };
        }
      },
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: INGRESO – VISTA PREVIA (confirmar)
  ═══════════════════════════════════════════════════════════════════ */
  function pageIngresoPreview() {
    const { ingresoId } = Router.params;
    const ing   = DB.getIngresoById(ingresoId);
    if (!ing) { Router.go('ingresos'); return { html: '', bind() {} }; }
    const prov  = DB.getProveedorById(ing.proveedorId);
    const items = ing.items || [];
    const total = items.reduce((s, x) => s + (x.precioUnitario * x.cantidad), 0);

    const itemsHTML = items.map(it => {
      const w = DB.getWines().find(w => w.id === it.wineId);
      const name = w ? `${w.nombre} ${w.añada}` : it.wineNombre;
      return `
        <div class="ingreso-item">
          <div class="ingreso-item__main">
            <span class="ingreso-item__name">${name}</span>
            ${it.isNew ? `<span class="new-wine-tag">Nuevo</span>` : ''}
            ${it.costoActualizado ? `<span class="cost-change-alert">Costo actualizado</span>` : ''}
          </div>
          <div class="ingreso-item__meta">
            <span>${it.cantidad} bot.</span>
            <span>${fmtCurrency(it.precioUnitario)} c/u</span>
            <span style="color:var(--text-2)">${fmtCurrency(it.precioUnitario * it.cantidad)}</span>
          </div>
        </div>`;
    }).join('');

    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">Vista Previa</span>
            <span></span>
          </header>
          <div class="content content--with-fab">
            <div class="preview-prov preview-prov--kv">
              <div class="preview-prov__row">
                <span class="preview-prov__label">Proveedor</span>
                <span class="preview-prov__val">${prov ? escHtml(prov.nombre) : '—'}</span>
              </div>
              <div class="preview-prov__row">
                <span class="preview-prov__label">Nº Factura</span>
                <span class="preview-prov__val">${escHtml(ing.nroFactura || '—')}</span>
              </div>
              <div class="preview-prov__row">
                <span class="preview-prov__label">Fecha</span>
                <span class="preview-prov__val">${fmtDate(ing.fecha)}</span>
              </div>
            </div>

            <div style="margin:16px 0 8px;font-weight:600">Ítems (${items.length})</div>
            ${itemsHTML}

            <div class="preview-total-row">
              <span class="preview-total-sm">Total factura</span>
              <span style="font-size:20px;font-weight:700;color:var(--gold)">${fmtCurrency(total)}</span>
            </div>

            ${items.some(i => i.costoActualizado) ? `
              <div style="background:var(--warning-bg,#2A1800);border:1px solid var(--warning);border-radius:var(--radius-sm);padding:10px 12px;margin-top:12px;font-size:13px;color:var(--warning)">
                ⚠️ Algunos costos fueron actualizados según esta factura.
              </div>` : ''}
            ${items.some(i => i.isNew) ? `
              <div style="background:var(--success-bg);border:1px solid var(--success);border-radius:var(--radius-sm);padding:10px 12px;margin-top:8px;font-size:13px;color:var(--success)">
                ✦ Se crearán ${items.filter(i => i.isNew).length} vino(s) nuevo(s) en el catálogo.
              </div>` : ''}
          </div>
          <button class="fab" id="btn-confirm" style="background:var(--success);font-size:13px;width:auto;right:16px;padding:0 20px;border-radius:24px">Confirmar ingreso</button>
        </div>`,
      bind() {
        document.getElementById('btn-back').onclick = () => Router.back();

        document.getElementById('btn-confirm').onclick = () => {
          const current = DB.getIngresoById(ingresoId);
          // Apply stock updates
          (current.items || []).forEach(it => {
            const w = DB.getWines().find(w => w.id === it.wineId);
            if (w) {
              DB.updateWine(w.id, { stock_actual: (w.stock_actual || 0) + it.cantidad });
              DB.addMovement({
                wineId: w.id, tipo: 'entrada', cantidad: it.cantidad,
                userId: Auth.user.id, userName: Auth.user.nombre,
                nota: `Ingreso #${current.nroFactura || ingresoId} — ${prov ? prov.nombre : ''}`,
              });
            }
          });
          DB.updateIngreso(ingresoId, {
            estado: 'confirmado',
            confirmadoPor: Auth.user.id, confirmadoEn: now(),
          });
          Toast.show('Ingreso confirmado ✓', 'success');
          Router.go('ingreso-detail', { ingresoId });
        };
      },
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: INGRESO – DETALLE (confirmado, solo lectura)
  ═══════════════════════════════════════════════════════════════════ */
  function pageIngresoDetail() {
    const { ingresoId } = Router.params;
    const ing   = DB.getIngresoById(ingresoId);
    if (!ing) { Router.go('ingresos'); return { html: '', bind() {} }; }
    const prov  = DB.getProveedorById(ing.proveedorId);
    const items = ing.items || [];
    const total = items.reduce((s, x) => s + (x.precioUnitario * x.cantidad), 0);
    const wines = DB.getWines();

    const itemsHTML = items.map(it => {
      const w    = wines.find(w => w.id === it.wineId);
      const name = w ? `${w.nombre} ${w.añada}` : it.wineNombre;
      return `
        <div class="ingreso-item">
          <div class="ingreso-item__main">
            <span class="ingreso-item__name">${name}</span>
            ${it.isNew ? `<span class="new-wine-tag">Nuevo</span>` : ''}
            ${it.costoActualizado ? `<span class="cost-change-alert">Costo actualizado</span>` : ''}
          </div>
          <div class="ingreso-item__meta">
            <span>${it.cantidad} bot.</span>
            <span>${fmtCurrency(it.precioUnitario)} c/u</span>
            <span style="color:var(--text-2)">${fmtCurrency(it.precioUnitario * it.cantidad)}</span>
          </div>
        </div>`;
    }).join('');

    const correccionesHTML = (ing.correcciones || []).length
      ? ing.correcciones.map(c => `
          <div style="font-size:13px;padding:8px 0;border-bottom:1px solid var(--border)">
            <span style="color:var(--text-2)">${fmtDate(c.fecha)}</span>
            <strong style="margin-left:8px">${c.userName}</strong>
            <p style="color:var(--text-2);margin-top:2px">${escHtml(c.nota)}</p>
          </div>`).join('')
      : '';

    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">Ingreso Confirmado</span>
            ${Auth.can('edit_closed_shift') ? `<button class="topbar__action" id="btn-reabrir">Editar</button>` : '<span></span>'}
          </header>
          <div class="content">
            <div class="preview-prov preview-prov--kv">
              <div class="preview-prov__row">
                <span class="preview-prov__label">Proveedor</span>
                <span class="preview-prov__val">${prov ? escHtml(prov.nombre) : '—'}</span>
              </div>
              <div class="preview-prov__row">
                <span class="preview-prov__label">Nº Factura</span>
                <span class="preview-prov__val">${escHtml(ing.nroFactura || '—')}</span>
              </div>
              <div class="preview-prov__row">
                <span class="preview-prov__label">Fecha</span>
                <span class="preview-prov__val">${fmtDate(ing.fecha)}</span>
              </div>
              <div class="preview-prov__row">
                <span class="preview-prov__label">Confirmado por</span>
                <span class="preview-prov__val">${ing.confirmadoPor ? (DB.getUsers().find(u => u.id === ing.confirmadoPor)?.nombre || ing.confirmadoPor) : '—'}</span>
              </div>
            </div>

            <div style="margin:16px 0 8px;font-weight:600">Ítems (${items.length})</div>
            ${itemsHTML}

            <div class="preview-total-row">
              <span class="preview-total-sm">Total factura</span>
              <span style="font-size:20px;font-weight:700;color:var(--gold)">${fmtCurrency(total)}</span>
            </div>

            ${correccionesHTML ? `
              <div style="margin-top:20px">
                <div style="font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:4px">HISTORIAL DE EDICIONES</div>
                ${correccionesHTML}
              </div>` : ''}
          </div>
        </div>`,
      bind() {
        document.getElementById('btn-back').onclick = () => Router.back();
        const btnReabrir = document.getElementById('btn-reabrir');
        if (btnReabrir) {
          btnReabrir.onclick = () => {
            const correcciones = [...(ing.correcciones || []), {
              userId: Auth.user.id, userName: Auth.user.nombre,
              fecha: now(), nota: 'Ingreso reabierto para edición',
            }];
            DB.updateIngreso(ingresoId, { estado: 'en_progreso', correcciones });
            Router.go('ingreso-form', { ingresoId });
          };
        }
      },
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     APP
  ═══════════════════════════════════════════════════════════════════ */
  const App = {
    render() {
      const pages = {
        setup:            pageSetup,
        login:            pageLogin,
        dashboard:        pageDashboard,
        stock:            pageStock,
        'wine-form':      pageWineForm,
        'wine-detail':    pageWineDetail,
        'wine-types':     pageWineTypes,
        ventas:              pageVentas,
        'ventas-historial':  pageVentasHistorial,
        'ventas-reportes':   pageVentasReportes,
        'informe-turno':     pageInformeTurno,
        'informe-form':      pageInformeForm,
        'informe-preview':   pageInformePreview,
        'informe-detail':    pageInformeDetail,
        proveedores:         pageProveedores,
        'proveedor-form':    pageProveedorForm,
        'proveedor-detail':  pageProveedorDetail,
        ingresos:            pageIngresos,
        'ingreso-proveedor': pageIngresoProveedor,
        'ingreso-form':      pageIngresoForm,
        'ingreso-preview':   pageIngresoPreview,
        'ingreso-detail':    pageIngresoDetail,
      };
      const fn   = pages[Router.current] || pageDashboard;
      const view = fn();
      document.getElementById('app').innerHTML = view.html;
      view.bind();
      // Scroll top on each navigation
      document.querySelector('.content')?.scrollTo(0, 0);
      // Botón home persistente en todas las páginas excepto dashboard/login/setup
      const noHome = ['dashboard', 'login', 'setup'];
      if (!noHome.includes(Router.current) && Auth.user) {
        const pill = document.createElement('button');
        pill.className = 'home-pill';
        pill.innerHTML = '⌂ Inicio';
        pill.onclick   = () => Router.replace('dashboard');
        document.getElementById('app').appendChild(pill);
      }
    },

    init() {
      Auth.init();
      if (!DB.isSetupDone())   Router.current = 'setup';
      else if (Auth.user)      Router.current = 'dashboard';
      else                     Router.current = 'login';
      this.render();
    },
  };

  document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
