      bind() {
        document.getElementById('btn-logout').onclick = () => { Auth.logout(); Router.replace('login'); };
        document.querySelector('[data-go="stock"]').onclick  = () => Router.go('stock');
        document.querySelector('[data-go="ventas"]').onclick = () => Router.go('ventas');
        const btnProvs = document.querySelector('[data-go="proveedores"]');
        if (btnProvs) btnProvs.onclick = () => Router.go('proveedores');
      },
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: STOCK LIST
  ═══════════════════════════════════════════════════════════════════ */
  function pageStock() {
    const types      = DB.getWineTypes();
    const wines      = DB.getWines().filter(w => w.activo !== false);
    const filter     = Router.params.filter || 'all';
    const STOCK_BAJO = DB.getSetup().stockBajo ?? 3;
    const menuCount  = wines.filter(w => w.enMenu).length;
    const bajoCount  = wines.filter(w => (w.stock_actual ?? 0) <= STOCK_BAJO).length;
    const filtered   = filter === 'all'    ? wines
                     : filter === '__menu' ? wines.filter(w => w.enMenu)
                     : filter === '__bajo' ? wines.filter(w => (w.stock_actual ?? 0) <= STOCK_BAJO)
                     :                      wines.filter(w => w.tipo === filter);
    const count      = t => wines.filter(w => w.tipo === t).length;

    const listHTML = filtered.length
      ? filtered.map(w => {
          const stockBajo = (w.stock_actual ?? 0) <= STOCK_BAJO;
          return `
          <button class="wine-item" data-id="${w.id}">
            <div class="wine-item__main">
              <div class="wine-item__name">${escHtml(w.nombre)} <span class="wine-item__anada">${w.añada}</span></div>
              <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">
                ${typeBadge(w.tipo)}
                ${w.enMenu ? `<span class="menu-badge">📖 Menú</span>` : ''}
                ${stockBajo ? `<span style="font-size:10px;font-weight:700;color:var(--warning)">⚠️ Bajo</span>` : ''}
              </div>
            </div>
            <div class="wine-item__meta">
              <span class="wine-item__stock${w.stock_actual === 0 ? ' wine-item__stock--zero' : ''}">${w.stock_actual ?? 0} bot.</span>
              <span class="wine-item__price">${fmtCurrency(w.precio_carta)}</span>
            </div>
          </button>`;
        }).join('')
      : `<div class="empty-state"><p>Sin vinos en esta categoría</p></div>`;

    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">Stock</span>
            ${Auth.can('settings') ? `<button class="topbar__action" id="btn-types">Tipos</button>` : '<span></span>'}
          </header>
          <div class="content content--with-fab">
            ${Auth.can('manage_stock') ? `<button class="stock-ingreso-btn" id="btn-ingreso">📦 Ingreso de Mercadería</button>` : ''}
            <div class="search-bar">
              <input class="search-bar__input" id="inp-search" type="search" placeholder="Buscar vino…" autocomplete="off">
            </div>
            <div class="filter-chips">
              <button class="chip${filter==='all'?' chip--active':''}" data-f="all">Todos <span class="chip__count">${wines.length}</span></button>
              ${bajoCount > 0 ? `<button class="chip${filter==='__bajo'?' chip--active':''}" data-f="__bajo" style="${filter !== '__bajo' ? 'border-color:var(--warning);color:var(--warning)' : ''}">⚠️ Stock bajo <span class="chip__count">${bajoCount}</span></button>` : ''}
              ${menuCount > 0 ? `<button class="chip${filter==='__menu'?' chip--active':''}" data-f="__menu">📖 Tu Menú <span class="chip__count">${menuCount}</span></button>` : ''}
              ${types.map(t => `<button class="chip${filter===t?' chip--active':''}" data-f="${t}">${t} <span class="chip__count">${count(t)}</span></button>`).join('')}
            </div>
            ${Auth.can('settings') ? `
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--text-2)">
              <span>Umbral stock bajo:</span>
              <input type="number" id="inp-stock-bajo" value="${STOCK_BAJO}" min="0" max="99"
                style="width:48px;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:3px 6px;font-size:12px;text-align:center" inputmode="numeric">
              <span>bot.</span>
              <button id="btn-stock-bajo-save" style="font-size:11px;color:var(--gold);background:none;border:1px solid var(--border);border-radius:4px;cursor:pointer;padding:3px 8px">Guardar</button>
            </div>` : ''}
            <div class="wine-list" id="wine-list">${listHTML}</div>
          </div>
          <button class="fab" id="btn-add">+</button>
        </div>`,
      bind() {
        document.getElementById('btn-back').onclick = () => Router.back();
        document.getElementById('btn-add').onclick  = () => Router.go('wine-form', { mode: 'create' });

        if (Auth.can('settings')) {
          document.getElementById('btn-types').onclick = () => Router.go('wine-types');
          document.getElementById('btn-stock-bajo-save').onclick = () => {
            const val = parseInt(document.getElementById('inp-stock-bajo').value);
            if (isNaN(val) || val < 0) { Toast.error('Valor inválido'); return; }
            DB.updateSetup({ stockBajo: val });
            Toast.success('Umbral actualizado');
            App.render();
          };
        }
        if (Auth.can('manage_stock')) {
          document.getElementById('btn-ingreso').onclick = () => Router.go('ingresos');
        }

        document.querySelectorAll('.chip').forEach(c => {
          c.onclick = () => { Router.params.filter = c.dataset.f; App.render(); };
        });

        document.getElementById('inp-search').oninput = e => {
          const q = normalize(e.target.value);
          document.querySelectorAll('.wine-item').forEach(item => {
            const name = normalize(item.querySelector('.wine-item__name').textContent);
            item.style.display = name.includes(q) ? '' : 'none';
          });
        };

        document.querySelectorAll('.wine-item').forEach(item => {
          item.onclick = () => Router.go('wine-detail', { id: item.dataset.id });
        });
      },
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: WINE FORM (create + edit)
  ═══════════════════════════════════════════════════════════════════ */
  function pageWineForm() {
    const { mode, id } = Router.params;
    const isEdit       = mode === 'edit';
    const wine         = isEdit ? DB.getWineById(id) : null;
    const types        = DB.getWineTypes();
    const canPrice     = Auth.can('edit_price');
    const v            = wine || {};

    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">${isEdit ? 'Editar vino' : 'Nuevo vino'}</span>
            <span></span>
          </header>
          <div class="content">
            <form id="wine-form" class="form" novalidate>

              <!-- NOMBRE -->
              <div class="field" id="f-nombre">
                <label class="field__label">Nombre <span class="field__req">*</span></label>
                <input class="field__input" id="inp-nombre" type="text" value="${v.nombre || ''}"
                  autocomplete="off" placeholder="Ej: Achaval Ferrer Malbec">
                <div class="autocomplete-list hidden" id="ac-list"></div>
                <span class="field__error" id="err-nombre"></span>
              </div>

              <!-- AÑADA -->
              <div class="field" id="f-anada">
                <label class="field__label">Añada <span class="field__req">*</span></label>
                <input class="field__input" id="inp-anada" type="number" value="${v.añada || ''}"
                  min="1900" max="${new Date().getFullYear()}" inputmode="numeric"
                  placeholder="${new Date().getFullYear() - 1}">
                <span class="field__error" id="err-anada"></span>
              </div>

              <!-- TIPO -->
              <div class="field" id="f-tipo">
                <label class="field__label">Tipo <span class="field__req">*</span></label>
                <select class="field__input field__select" id="inp-tipo">
                  <option value="">Seleccionar tipo…</option>
                  ${types.map(t => `<option value="${t}"${v.tipo === t ? ' selected' : ''}>${t}</option>`).join('')}
                </select>
                <span class="field__error" id="err-tipo"></span>
              </div>

              <!-- COSTO + PRECIO (2 cols) -->
              <div class="form-row">
                <div class="field" id="f-costo">
                  <label class="field__label">Costo <span class="field__req">*</span></label>
                  <div class="field__prefix-wrap">
                    <span class="field__prefix">$</span>
                    <input class="field__input field__input--prefixed" id="inp-costo" type="number"
                      value="${v.costo || ''}" min="0.01" step="0.01" inputmode="decimal" placeholder="0">
                  </div>
                  <span class="field__error" id="err-costo"></span>
                </div>
                <div class="field" id="f-precio">
                  <label class="field__label">
                    Precio carta ${canPrice ? `<span class="field__req">*</span>` : `<span class="field__lock" title="Sin permiso">🔒</span>`}
                  </label>
                  <div class="field__prefix-wrap">
                    <span class="field__prefix">$</span>
                    <input class="field__input field__input--prefixed" id="inp-precio" type="number"
                      value="${v.precio_carta || ''}" min="0.01" step="0.01" inputmode="decimal" placeholder="0"
                      ${!canPrice ? 'disabled' : ''}>
                  </div>
                  ${!canPrice ? `<span class="field__hint">Solo Head Som o Dueño pueden editar el precio</span>` : ''}
                  <span class="field__error" id="err-precio"></span>
                </div>
              </div>

              <!-- PROVEEDOR (opcional) -->
              <div class="field" id="f-proveedor">
                <label class="field__label">Proveedor habitual <span style="color:var(--text-muted);font-weight:400;text-transform:none">(opcional)</span></label>
                <select class="field__input field__select" id="inp-proveedor">
                  <option value="">Sin proveedor asignado</option>
                  ${DB.getProveedores().filter(p => p.activo !== false).map(p =>
                    `<option value="${p.id}"${v.proveedorId === p.id ? ' selected' : ''}>${escHtml(p.nombre_fantasia || p.nombre)}</option>`
                  ).join('')}
                </select>
                <button type="button" id="btn-nuevo-prov" style="margin-top:6px;font-size:12px;color:var(--gold);background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 10px;cursor:pointer;width:100%">
                  + Crear proveedor nuevo
                </button>
                <div id="nuevo-prov-panel" style="display:none;margin-top:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:12px">
                  <div style="font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em">Nuevo proveedor</div>
                  <div class="field-group" style="margin-bottom:8px">
                    <label class="field-label">Razón social <span style="color:var(--error)">*</span></label>
                    <input class="field-input" id="inp-np-nombre" type="text" placeholder="Ej: Bodegas Catena Zapata S.A." autocomplete="off">
                  </div>
                  <div class="field-group" style="margin-bottom:8px">
                    <label class="field-label">Nombre fantasía</label>
                    <input class="field-input" id="inp-np-fantasia" type="text" placeholder="Ej: Catena Zapata">
                  </div>
                  <div class="field-group" style="margin-bottom:8px">
                    <label class="field-label">Vendedor / contacto</label>
                    <input class="field-input" id="inp-np-contacto" type="text" placeholder="Nombre del vendedor">
                  </div>
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
                    <div class="field-group">
                      <label class="field-label">Teléfono</label>
                      <input class="field-input" id="inp-np-tel" type="tel" placeholder="261 4123456">
                    </div>
                    <div class="field-group">
                      <label class="field-label">Email</label>
                      <input class="field-input" id="inp-np-email" type="email" placeholder="contacto@prov.com">
                    </div>
                  </div>
                  <div style="display:flex;gap:8px">
                    <button type="button" class="btn btn--primary" id="btn-np-save" style="flex:1;font-size:13px">Crear y asignar</button>
                    <button type="button" class="btn btn--outline" id="btn-np-cancel" style="flex:1;font-size:13px">Cancelar</button>
                  </div>
                </div>
              </div>

              <!-- TU MENÚ -->
              <div class="field stock-toggle-field">
                <label class="toggle-label">
                  <input type="checkbox" id="chk-menu" class="toggle-check" ${v.enMenu ? 'checked' : ''}>
                  <span class="toggle-switch"></span>
                  <span class="toggle-text">Pertenece a Tu Menú</span>
                </label>
              </div>

              ${!isEdit ? `
              <!-- STOCK INICIAL (solo al crear) -->
              <div class="field stock-toggle-field">
                <label class="toggle-label">
                  <input type="checkbox" id="chk-stock" class="toggle-check">
                  <span class="toggle-switch"></span>
                  <span class="toggle-text">Cargar stock inicial</span>
                </label>
              </div>
              <div class="field hidden" id="f-stock-init">
                <label class="field__label">Cantidad inicial</label>
                <div id="f-stock-botellas">
                  <input class="field__input" id="inp-stock" type="number" min="0" value="0" inputmode="numeric" placeholder="0 botellas">
                </div>
                <div id="f-stock-cajas" style="display:none;margin-top:8px">
                  <div style="display:flex;align-items:center;gap:8px">
                    <input class="field__input" id="inp-cajas" type="number" min="1" value="1" inputmode="numeric" style="flex:1;text-align:center">
                    <span style="color:var(--text-2);font-size:13px;white-space:nowrap">cajas ×</span>
                    <input class="field__input" id="inp-bot-caja" type="number" min="1" value="6" inputmode="numeric" style="flex:1;text-align:center">
                    <span style="color:var(--text-2);font-size:13px;white-space:nowrap">bot/caja</span>
                  </div>
                  <div style="margin-top:6px;font-size:13px;color:var(--text-2);text-align:right">
                    Total: <strong id="cajas-total" style="color:var(--gold)">6</strong> botellas
                  </div>
                </div>
                <label class="toggle-label" style="margin-top:10px">
                  <input type="checkbox" id="chk-cajas" class="toggle-check">
                  <span class="toggle-switch"></span>
                  <span class="toggle-text" style="font-size:12px;color:var(--text-2)">Ingresar por cajas</span>
                </label>
              </div>` : ''}

              <div class="form-actions">
                <button type="submit" class="btn btn--primary btn--full">
                  ${isEdit ? 'Guardar cambios' : 'Agregar vino'}
                </button>
              </div>
            </form>

            ${isEdit ? `
            <div style="margin-top:16px">
              <button class="btn btn--outline btn--full" id="btn-baja-vino" style="color:var(--error);border-color:var(--error)">Dar de baja este vino</button>
              <div id="baja-vino-confirm" style="display:none;background:var(--error-bg);border:1px solid var(--error);border-radius:var(--radius-sm);padding:12px;margin-top:8px;font-size:13px;color:var(--text)">
                ¿Dar de baja este vino? Ya no aparecerá en el catálogo ni en las búsquedas. El historial de movimientos se conserva.
                <div style="display:flex;gap:8px;margin-top:10px">
                  <button class="btn btn--primary" id="btn-baja-vino-ok" style="flex:1;background:var(--error);border-color:var(--error)">Confirmar</button>
                  <button class="btn btn--outline" id="btn-baja-vino-cancel" style="flex:1">Cancelar</button>
                </div>
              </div>
            </div>` : ''}
          </div>
        </div>`,

      bind() {
        document.getElementById('btn-back').onclick = () => Router.back();

        // ── Crear proveedor inline ────────────────────────────────
        document.getElementById('btn-nuevo-prov').onclick = () => {
          document.getElementById('nuevo-prov-panel').style.display = '';
          document.getElementById('btn-nuevo-prov').style.display = 'none';
          document.getElementById('inp-np-nombre').focus();
        };
        document.getElementById('btn-np-cancel').onclick = () => {
          document.getElementById('nuevo-prov-panel').style.display = 'none';
          document.getElementById('btn-nuevo-prov').style.display = '';
        };
        document.getElementById('btn-np-save').onclick = () => {
          const nombre = document.getElementById('inp-np-nombre').value.trim();
          if (!nombre) { Toast.error('La razón social es requerida'); return; }
          const nuevo = DB.addProveedor({
            id:              uid(),
            nombre,
            nombre_fantasia: document.getElementById('inp-np-fantasia').value.trim(),
            nombre_contacto: document.getElementById('inp-np-contacto').value.trim(),
            telefono:        document.getElementById('inp-np-tel').value.trim(),
            email:           document.getElementById('inp-np-email').value.trim(),
            condiciones_pago: '',
            notas:           '',
            activo:          true,
            creadoEn:        now(),
            creadoPor:       Auth.user.id,
          });
          const sel = document.getElementById('inp-proveedor');
          const label = nuevo.nombre_fantasia || nuevo.nombre;
          const opt = document.createElement('option');
          opt.value = nuevo.id;
          opt.textContent = label;
          opt.selected = true;
          sel.appendChild(opt);
          document.getElementById('nuevo-prov-panel').style.display = 'none';
          document.getElementById('btn-nuevo-prov').style.display = '';
          Toast.success(`"${label}" creado y asignado`);
        };

        // ── Toggle stock inicial + cajas ──────────────────────────
        if (!isEdit) {
          document.getElementById('chk-stock').onchange = e => {
            document.getElementById('f-stock-init').classList.toggle('hidden', !e.target.checked);
          };
          document.getElementById('chk-cajas').onchange = e => {
            document.getElementById('f-stock-botellas').style.display = e.target.checked ? 'none' : '';
            document.getElementById('f-stock-cajas').style.display    = e.target.checked ? '' : 'none';
          };
          const calcCajas = () => {
            const c = Math.max(1, parseInt(document.getElementById('inp-cajas').value) || 1);
            const b = Math.max(1, parseInt(document.getElementById('inp-bot-caja').value) || 1);
            document.getElementById('cajas-total').textContent = c * b;
          };
          document.getElementById('inp-cajas').oninput    = calcCajas;
          document.getElementById('inp-bot-caja').oninput = calcCajas;
        }

        // ── Autocomplete nombre ───────────────────────────────────
        const inpNombre = document.getElementById('inp-nombre');
        const acList    = document.getElementById('ac-list');

        inpNombre.oninput = () => {
          const q = normalize(inpNombre.value);
          if (q.length < 2) { acList.classList.add('hidden'); return; }
          const names = [...new Set(
            DB.getWines()
              .filter(w => normalize(w.nombre).includes(q))
              .map(w => w.nombre)
          )].slice(0, 6);
          if (!names.length) { acList.classList.add('hidden'); return; }
          acList.innerHTML = names.map(n => `<div class="ac-item" data-name="${n}">${n}</div>`).join('');
          acList.classList.remove('hidden');
          acList.querySelectorAll('.ac-item').forEach(item => {
            item.onmousedown = e => {   // mousedown so it fires before input blur
              e.preventDefault();
              inpNombre.value = item.dataset.name;
              acList.classList.add('hidden');
              checkDuplicate();
            };
          });
        };

        inpNombre.onblur = () => setTimeout(() => acList.classList.add('hidden'), 150);

        // ── Duplicate check ───────────────────────────────────────
        const errNombre = document.getElementById('err-nombre');
        const checkDuplicate = () => {
          const nombre = inpNombre.value.trim();
          const añada  = document.getElementById('inp-anada').value;
          if (nombre && añada && WineValidator.isDuplicate(nombre, añada, isEdit ? id : null)) {
            errNombre.textContent = `Ya existe "${nombre}" ${añada}`;
            document.getElementById('f-nombre').classList.add('field--error');
          } else {
            errNombre.textContent = '';
            document.getElementById('f-nombre').classList.remove('field--error');
          }
        };

        document.getElementById('inp-anada').onblur = checkDuplicate;
        inpNombre.onblur = () => { setTimeout(() => acList.classList.add('hidden'), 150); checkDuplicate(); };

        // ── Form submit ───────────────────────────────────────────
        document.getElementById('wine-form').onsubmit = e => {
          e.preventDefault();

          const data = {
            nombre:      document.getElementById('inp-nombre').value.trim(),
            añada:       document.getElementById('inp-anada').value,
            tipo:        document.getElementById('inp-tipo').value,
            costo:       document.getElementById('inp-costo').value,
            precio_carta: canPrice
              ? document.getElementById('inp-precio').value
              : String(v.precio_carta || ''),
          };

          const errors = WineValidator.validate(data, isEdit ? id : null);

          // Clear previous errors
          const fieldMap = { nombre: 'nombre', añada: 'anada', tipo: 'tipo', costo: 'costo', precio_carta: 'precio' };
          Object.keys(fieldMap).forEach(k => {
            const errEl = document.getElementById(`err-${fieldMap[k]}`);
            const fEl   = document.getElementById(`f-${fieldMap[k]}`);
            if (errEl) errEl.textContent = '';
            if (fEl)   fEl.classList.remove('field--error');
          });

          if (Object.keys(errors).length) {
            Object.entries(errors).forEach(([k, msg]) => {
              const key   = fieldMap[k] || k;
              const errEl = document.getElementById(`err-${key}`);
              const fEl   = document.getElementById(`f-${key}`);
              if (errEl) errEl.textContent = msg;
              if (fEl)   fEl.classList.add('field--error');
            });
            // Scroll to first error
            document.querySelector('.field--error')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
          }

          if (isEdit) {
            const update = {
              nombre:      data.nombre,
              añada:       Number(data.añada),
              tipo:        data.tipo,
              costo:       Number(data.costo),
              proveedorId: document.getElementById('inp-proveedor').value || null,
              enMenu:      document.getElementById('chk-menu').checked,
            };
            if (canPrice) update.precio_carta = Number(data.precio_carta);
            DB.updateWine(id, update);
            Toast.success('Vino actualizado');
            Router.back();

          } else {
            const chk       = document.getElementById('chk-stock');
            const usaCajas  = chk?.checked && document.getElementById('chk-cajas')?.checked;
            const stockQty  = !chk?.checked ? 0
              : usaCajas
                ? Math.max(1, parseInt(document.getElementById('inp-cajas').value)||1) * Math.max(1, parseInt(document.getElementById('inp-bot-caja').value)||1)
                : Math.max(0, Number(document.getElementById('inp-stock').value) || 0);

            const newWine = {
              id:           uid(),
              nombre:       data.nombre,
              añada:        Number(data.añada),
              tipo:         data.tipo,
              costo:        Number(data.costo),
              precio_carta: Number(data.precio_carta) || 0,
              proveedorId:  document.getElementById('inp-proveedor').value || null,
              enMenu:       document.getElementById('chk-menu').checked,
              stock_actual: stockQty,
              activo:       true,
              createdAt:    now(),
              createdBy:    Auth.user.id,
            };
            DB.addWine(newWine);

            // Traceability: every stock change generates a movement
            if (stockQty > 0) {
              DB.addMovement({
                wineId:   newWine.id,
                tipo:     'entrada_inicial',
                cantidad: stockQty,
                userId:   Auth.user.id,
                userName: Auth.user.nombre,
                nota:     'Stock inicial al crear el vino',
              });
            }

            Toast.success(`"${data.nombre}" agregado`);
            Router.replace('stock');
          }
        };

        // ── Dar de baja (solo modo edición) ──────────────────────
        if (isEdit) {
          const btnBaja = document.getElementById('btn-baja-vino');
          btnBaja.onclick = () => {
            document.getElementById('baja-vino-confirm').style.display = '';
            btnBaja.style.display = 'none';
          };
          document.getElementById('btn-baja-vino-cancel').onclick = () => {
            document.getElementById('baja-vino-confirm').style.display = 'none';
            btnBaja.style.display = '';
          };
          document.getElementById('btn-baja-vino-ok').onclick = () => {
            DB.updateWine(id, { activo: false });
            Toast.success('Vino dado de baja');
            Router.replace('stock');
          };
        }
      },
    };
  }

                <span class="stat-card__label">Costo</span>
                <span class="stat-card__value">${fmtCurrency(wine.costo)}</span>

            ${prov ? `

              <span style="color:var(--text-muted)">Proveedor</span>

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: WINE TYPES (settings)
  ═══════════════════════════════════════════════════════════════════ */
  function pageWineTypes() {
    const types = DB.getWineTypes();

    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">Tipos de vino</span>
            <span></span>
          </header>
          <div class="content">
            <p class="page-desc">Clasificaciones que aparecen en el stock y en los filtros. Podés agregar o eliminar según tu carta.</p>
            <div class="types-list" id="types-list">
              ${types.map((t, i) => {
                const c = WINE_COLORS[t] || { bg: '#3D1A20' };
                return `
                  <div class="type-item" data-i="${i}">
                    <span class="type-item__dot" style="background:${c.bg}"></span>
                    <span class="type-item__name">${t}</span>
                    <button class="type-item__delete" data-i="${i}" title="Eliminar">✕</button>
                  </div>`;
              }).join('')}
            </div>
            <div class="add-type-row">
              <input class="field__input" id="inp-new-type" type="text" placeholder="Nuevo tipo…" autocomplete="off">
              <button class="btn btn--primary" id="btn-add-type">Agregar</button>
            </div>
          </div>
        </div>`,
      bind() {
        document.getElementById('btn-back').onclick = () => Router.back();

        document.getElementById('btn-add-type').onclick = () => {
          const val = document.getElementById('inp-new-type').value.trim();
          if (!val) return;
          const types = DB.getWineTypes();
          if (types.map(normalize).includes(normalize(val))) { Toast.error('Ese tipo ya existe'); return; }
          types.push(val);
          DB.saveWineTypes(types);
          document.getElementById('inp-new-type').value = '';
          Toast.success(`"${val}" agregado`);
          App.render();
        };

        document.getElementById('inp-new-type').onkeydown = e => {
          if (e.key === 'Enter') { e.preventDefault(); document.getElementById('btn-add-type').click(); }
        };

        document.querySelectorAll('.type-item__delete').forEach(btn => {
          btn.onclick = () => {
            const types   = DB.getWineTypes();
            const removed = types[Number(btn.dataset.i)];
            const inUse   = DB.getWines().some(w => w.tipo === removed);
            if (inUse) { Toast.error(`"${removed}" está en uso — no se puede eliminar`); return; }
            types.splice(Number(btn.dataset.i), 1);
            DB.saveWineTypes(types);
            Toast.success(`"${removed}" eliminado`);
            App.render();
          };
        });
      },
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: VENTAS HUB
  ═══════════════════════════════════════════════════════════════════ */
  function pageVentas() {
    const inProgreso  = DB.getInformeEnProgreso();
    const informes    = DB.getInformes();
    const confirmados = informes.filter(i => i.estado === 'confirmado');

    const enPreview   = informes.find(i => i.estado === 'preview');

    // Stats rápidos para las cards
    const ahora    = new Date();
    const startMes = new Date(ahora.getFullYear(), ahora.getMonth(), 1);
    const desMes   = confirmados.filter(i => new Date(i.confirmedAt || i.fecha) >= startMes);
    const botsMes  = desMes.reduce((s, inf) => s + inf.items.reduce((a, i) => a + i.cantidad, 0), 0);
    const factMes  = desMes.reduce((s, inf) => s + inf.items.reduce((a, i) => a + ((i.vinoPrecio || 0) * i.cantidad), 0), 0);
    const turnoLabel = t => t === 'mediodia' ? '☀️ Mediodía' : '🌙 Noche';
    const fmtFecha   = iso => new Date(iso).toLocaleDateString('es-AR', { weekday: 'short', day: '2-digit', month: '2-digit' });

    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">Ventas</span>
            <span></span>
          </header>
          <div class="content">
            ${inProgreso ? `
            <div class="in-progress-banner" id="btn-continue">
              <div>
                <div class="in-progress-banner__title">Turno en progreso</div>
                <div class="in-progress-banner__meta">${turnoLabel(inProgreso.turno)} · ${fmtFecha(inProgreso.fecha)} · ${inProgreso.items.length} ítems cargados</div>
              </div>
              <span class="in-progress-banner__arrow">→</span>
            </div>` : ''}

            ${enPreview ? `
            <div class="in-progress-banner" id="btn-preview-pendiente" style="border-color:var(--warning,#e6a817);background:rgba(230,168,23,0.08);">
              <div>
                <div class="in-progress-banner__title" style="color:var(--warning,#e6a817);">⚠️ Turno pendiente de confirmar</div>
                <div class="in-progress-banner__meta">${turnoLabel(enPreview.turno)} · ${fmtFecha(enPreview.fecha)} · ${enPreview.items.length} ítem${enPreview.items.length !== 1 ? 's' : ''} · en vista previa</div>
              </div>
              <span class="in-progress-banner__arrow">→</span>
            </div>` : ''}

            <div class="ventas-hub">
              ${Auth.can('close_shift') ? `
              <button class="ventas-hub__card ventas-hub__card--carga" id="btn-carga">
                <div class="ventas-hub__icon">📋</div>
                <div class="ventas-hub__info">
                  <div class="ventas-hub__title">${inProgreso ? 'Continuar turno en progreso' : (enPreview ? 'Retomar vista previa' : 'Cargar turno')}</div>
                  <div class="ventas-hub__sub">${inProgreso ? `${turnoLabel(inProgreso.turno)} · ${inProgreso.items.length} ítems` : (enPreview ? `${turnoLabel(enPreview.turno)} · pendiente de confirmar` : 'Mediodía o Noche')}</div>
                </div>
                <span class="ventas-hub__arrow">→</span>
              </button>` : ''}

              <button class="ventas-hub__card" id="btn-historial">
                <div class="ventas-hub__icon">📜</div>
                <div class="ventas-hub__info">
                  <div class="ventas-hub__title">Historial</div>
                  <div class="ventas-hub__sub">${confirmados.length} turno${confirmados.length !== 1 ? 's' : ''} registrado${confirmados.length !== 1 ? 's' : ''}</div>
                </div>
                <span class="ventas-hub__arrow">→</span>

                <div class="ventas-hub__icon">📊</div>

                  <div class="ventas-hub__sub">${botsMes} bot. este mes${factMes > 0 ? ` · ${fmtCurrency(factMes)}` : ''} · ${desMes.length} turno${desMes.length !== 1 ? 's' : ''}</div>

                <span class="ventas-hub__arrow">→</span>

      bind() {

              Router.go('informe-turno');
            }
          };

        document.getElementById('btn-historial').onclick = () => Router.go('ventas-historial');
        document.getElementById('btn-reportes').onclick  = () => Router.go('ventas-reportes');

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: VENTAS — HISTORIAL
  ═══════════════════════════════════════════════════════════════════ */
  function pageVentasHistorial() {
    const vFilter = Router.params.vFilter || 'todo';
    // Solo informes confirmados. Los en_progreso y preview son estados operativos, no historial.
    const allInformes = DB.getInformes().filter(i => i.estado === 'confirmado').slice().reverse();

    const ahora      = new Date();
    const start7d    = new Date(ahora); start7d.setDate(ahora.getDate() - 6); start7d.setHours(0, 0, 0, 0);
    const startMes   = new Date(ahora.getFullYear(), ahora.getMonth(), 1);

    const filtered = allInformes.filter(inf => {
      const d = new Date(inf.confirmedAt || inf.fecha);
      if (vFilter === '7d')      return d >= start7d;
      if (vFilter === 'mes')     return d >= startMes;
      if (vFilter === 'mediodia') return inf.turno === 'mediodia';
      if (vFilter === 'noche')    return inf.turno === 'noche';
      return true;
    });

    const turnoIcon  = t => t === 'mediodia' ? '☀️' : '🌙';
    const turnoNom   = t => t === 'mediodia' ? 'Mediodía' : 'Noche';
    const fmtFecha   = iso => new Date(iso).toLocaleDateString('es-AR', { weekday: 'short', day: '2-digit', month: '2-digit', year: '2-digit' });
    const fmtHora    = iso => new Date(iso).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    const totalBot   = inf => inf.items.reduce((s, i) => s + i.cantidad, 0);
    const totalFact  = inf => inf.items.reduce((s, item) => {
      const precio = item.vinoPrecio != null
        ? item.vinoPrecio
        : (DB.getWineById(item.vinoId)?.precio_carta || 0);
      return s + precio * item.cantidad;
    }, 0);

    const listHTML = filtered.length === 0
      ? `<div class="empty-state"><p>Sin registros en este filtro</p></div>`
      : filtered.map(inf => {
          const confirmTs  = inf.confirmedAt || inf.fecha;
          const factVal    = totalFact(inf);
          return `
            <button class="informe-card" data-id="${inf.id}">
              <div class="informe-card__left">
                <div class="informe-card__fecha">${fmtFecha(inf.fecha)}</div>
                <div class="informe-card__turno">${turnoIcon(inf.turno)} ${turnoNom(inf.turno)}</div>
                <div style="font-size:11px;color:var(--text-muted);margin-top:2px">
                  ${inf.confirmedByNombre || inf.usuarioNombre}
                  ${inf.confirmedAt ? '· ' + fmtHora(inf.confirmedAt) : ''}
                </div>
              </div>
              <div class="informe-card__right">
                <span class="inf-badge inf-badge--${inf.estado}">${inf.estado === 'confirmado' ? 'Confirmado' : 'Preview'}</span>
                <div class="informe-card__total">${totalBot(inf)} bot.</div>
                ${factVal > 0 ? `<div style="font-size:12px;font-weight:600;color:var(--gold-light)">${fmtCurrency(factVal)}</div>` : ''}
                ${inf.ediciones?.length ? `<div style="font-size:10px;color:var(--text-muted)">${inf.ediciones.length} edición${inf.ediciones.length > 1 ? 'es' : ''}</div>` : ''}
              </div>
            </button>`;
        }).join('');

    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">Historial de ventas</span>
            <span></span>
          </header>
          <div class="content">
            <div class="filter-chips">
              <button class="chip${vFilter==='todo'?' chip--active':''}" data-vf="todo">Todos <span class="chip__count">${allInformes.length}</span></button>
              <button class="chip${vFilter==='7d'?' chip--active':''}" data-vf="7d">7 días</button>
              <button class="chip${vFilter==='mes'?' chip--active':''}" data-vf="mes">Este mes</button>
              <button class="chip${vFilter==='mediodia'?' chip--active':''}" data-vf="mediodia">☀️ Mediodía</button>
              <button class="chip${vFilter==='noche'?' chip--active':''}" data-vf="noche">🌙 Noche</button>
            </div>
            <div class="informe-list">${listHTML}</div>
          </div>
        </div>`,
      bind() {
        document.getElementById('btn-back').onclick = () => Router.back();
        document.querySelectorAll('[data-vf]').forEach(c => {
          c.onclick = () => { Router.params.vFilter = c.dataset.vf; App.render(); };
        });
        document.querySelectorAll('.informe-card').forEach(card => {
          card.onclick = () => Router.go('informe-detail', { id: card.dataset.id });
        });
      },
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: VENTAS — REPORTES
  ═══════════════════════════════════════════════════════════════════ */
  function pageVentasReportes() {
    const periodo  = Router.params.rPeriodo || 'mes';
    const desdeStr = Router.params.rDesde   || '';
    const hastaStr = Router.params.rHasta   || '';

    const { desde, hasta } = getVentasRange(periodo, desdeStr, hastaStr);
    const { filtered, totalBotellas, totalFacturado, porTipo, topVinos, porProv } = calcVentasReport(DB.getInformes(), desde, hasta);

    const types      = DB.getWineTypes();
    const proveedores = DB.getProveedores();
    const mediodias  = filtered.filter(i => i.turno === 'mediodia').length;
    const noches     = filtered.filter(i => i.turno === 'noche').length;
    const promTurno  = filtered.length ? Math.round(totalBotellas / filtered.length) : 0;

    // Por tipo: barras proporcionales
    const maxTipo = Math.max(...Object.values(porTipo), 1);
    const porTipoHTML = types
      .filter(t => porTipo[t] > 0)
      .sort((a, b) => (porTipo[b] || 0) - (porTipo[a] || 0))
      .map(tipo => {
        const c   = WINE_COLORS[tipo] || { bg: '#6A5050' };
        const pct = Math.round((porTipo[tipo] / maxTipo) * 100);
        return `
          <div class="report-bar-row">
            <div class="report-bar-row__header">
              <span>${typeBadge(tipo)}</span>
              <span class="report-bar-row__val">${porTipo[tipo]} bot.</span>
            </div>
            <div class="report-bar-track">
              <div class="report-bar-fill" style="background:${c.bg};width:${pct}%;opacity:0.85"></div>
            </div>
          </div>`;
      }).join('') || `<p class="report-empty">Sin datos en este período</p>`;

    // Top vinos
    const topVinosHTML = topVinos.length
      ? topVinos.map((v, i) => `
          <div class="report-ranking-item">
            <span class="report-ranking-item__pos">#${i + 1}</span>
            <div class="report-ranking-item__info">
              <div class="report-ranking-item__name">${escHtml(v.nombre)} <span style="color:var(--text-muted);font-weight:400">${v.añada}</span></div>
              <div>${typeBadge(v.tipo)}</div>
            </div>
            <span class="report-ranking-item__qty">${v.total}</span>
          </div>`).join('')
      : `<p class="report-empty">Sin datos en este período</p>`;

    // Por proveedor
    const porProvEntries = Object.entries(porProv).sort((a, b) => b[1] - a[1]);
    const totalConProv   = porProvEntries.reduce((s, [, v]) => s + v, 0);
    const coveragePct    = totalBotellas > 0 ? Math.round((totalConProv / totalBotellas) * 100) : 0;
    const coverageText   = totalBotellas > 0
      ? `${totalConProv} de ${totalBotellas} botellas con proveedor asignado (${coveragePct}%)`
      : '';
    const porProvHTML = porProvEntries.length
      ? porProvEntries.map(([provId, total]) => {
          const prov = proveedores.find(p => p.id === provId);
          return `
            <div class="report-ranking-item">
              <div class="report-ranking-item__info">
                <div class="report-ranking-item__name">${prov ? escHtml(prov.nombre) : 'Sin proveedor asignado'}</div>
              </div>
              <span class="report-ranking-item__qty">${total}</span>
            </div>`;
        }).join('')
      : `<p class="report-empty">Sin datos — asigná proveedores a los vinos para ver este reporte</p>`;

    const periodoLabel = { '7d': 'Últimos 7 días', 'mes': 'Este mes', 'mes_ant': 'Mes anterior', 'anio': 'Este año', 'todo': 'Todo el tiempo', 'custom': 'Rango personalizado' }[periodo] || 'Este mes';

    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">Reportes</span>
            <span></span>
          </header>
          <div class="content">

            <!-- Selector de período -->
            <div class="filter-chips periodo-chips">
              <button class="chip${periodo==='7d'?' chip--active':''}" data-p="7d">7 días</button>
              <button class="chip${periodo==='mes'?' chip--active':''}" data-p="mes">Este mes</button>
              <button class="chip${periodo==='mes_ant'?' chip--active':''}" data-p="mes_ant">Mes ant.</button>
              <button class="chip${periodo==='anio'?' chip--active':''}" data-p="anio">Este año</button>
              <button class="chip${periodo==='todo'?' chip--active':''}" data-p="todo">Todo</button>
              <button class="chip${periodo==='custom'?' chip--active':''}" data-p="custom">Rango</button>
            </div>

            ${periodo === 'custom' ? `
            <div style="display:flex;gap:10px;margin-bottom:16px">
              <div style="flex:1">
                <label class="field-label">Desde</label>
                <input class="field-input" id="inp-desde" type="date" value="${escHtml(desdeStr)}">
              </div>
              <div style="flex:1">
                <label class="field-label">Hasta</label>
                <input class="field-input" id="inp-hasta" type="date" value="${escHtml(hastaStr)}">
              </div>
            </div>` : ''}

            <!-- Stats principales -->
            <div class="report-stats">
              <div class="report-stat">
                <div class="report-stat__val">${totalBotellas}</div>
                <div class="report-stat__label">Botellas</div>
              </div>
              <div class="report-stat">
                <div class="report-stat__val">${filtered.length}</div>
                <div class="report-stat__label">Turnos</div>
              </div>
              <div class="report-stat">
                <div class="report-stat__val">${promTurno}</div>
                <div class="report-stat__label">Prom/turno</div>
              </div>
            </div>

            ${totalFacturado > 0 ? `
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted)">Facturación estimada</div>
                <div style="font-size:11px;color:var(--text-muted);margin-top:1px">A precio de carta</div>
              </div>
              <div style="font-size:22px;font-weight:800;color:var(--gold-light)">${fmtCurrency(totalFacturado)}</div>
            </div>` : ''}

            ${filtered.length > 0 ? `
            <div style="display:flex;gap:8px;margin-bottom:20px">
              <div style="flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;text-align:center">
                <div style="font-size:16px;font-weight:700;color:var(--text)">${mediodias}</div>
                <div style="font-size:11px;color:var(--text-muted)">☀️ Mediodía</div>
              </div>
              <div style="flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;text-align:center">
                <div style="font-size:16px;font-weight:700;color:var(--text)">${noches}</div>
                <div style="font-size:11px;color:var(--text-muted)">🌙 Noche</div>
              </div>
            </div>` : ''}

            <!-- Por tipo de vino -->
            <section class="section">
              <h3 class="section__title">Por tipo de vino</h3>
              ${porTipoHTML}
            </section>

            <!-- Ranking de vinos -->
            <section class="section">
              <h3 class="section__title">Top vinos vendidos</h3>
              ${topVinosHTML}
            </section>

            <!-- Por proveedor -->
            <section class="section">
              <h3 class="section__title">Por proveedor</h3>
              ${coverageText ? `<p style="font-size:12px;color:var(--text-muted);margin:0 0 10px">${coverageText}</p>` : ''}
              ${porProvHTML}
            </section>

          </div>
        </div>`,
      bind() {
        document.getElementById('btn-back').onclick = () => Router.back();

        document.querySelectorAll('[data-p]').forEach(c => {
          c.onclick = () => { Router.params.rPeriodo = c.dataset.p; App.render(); };
        });

        if (periodo === 'custom') {
          const apply = () => {
            const d = document.getElementById('inp-desde').value;
            const h = document.getElementById('inp-hasta').value;
            Router.params.rDesde = d;
            Router.params.rHasta = h;
            if (d && h) App.render();
          };
          document.getElementById('inp-desde').onchange = apply;
          document.getElementById('inp-hasta').onchange = apply;
        }
      },
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: INFORME TURNO PICKER
  ═══════════════════════════════════════════════════════════════════ */
  function pageInformeTurno() {
    const todayISO = new Date().toISOString().split('T')[0];
    const canEditDate = Auth.can('edit_closed_shift'); // Head Som / Dueño pueden ajustar la fecha

    // Detectar turnos ya confirmados para un día+turno dado
    const turnoYaExiste = (fecha, turno) => {
      return DB.getInformes().some(i => {
        if (i.estado !== 'confirmado') return false;
        return i.fecha.split('T')[0] === fecha && i.turno === turno;
      });
    };

    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">Nuevo Informe</span>
            <span></span>
          </header>
          <div class="content">
            <div class="turno-intro">
              <div class="turno-intro__icon">📋</div>
              <div class="turno-intro__title">¿Qué turno estás cerrando?</div>
            </div>

            <!-- Selector de fecha -->
            <div class="field" style="margin-bottom:16px">
              <label class="field__label" style="display:flex;justify-content:space-between;align-items:center">
                <span>Fecha del servicio</span>
                ${!canEditDate ? `<span style="font-size:11px;color:var(--text-muted)">Solo Head Som o Dueño pueden cambiarla</span>` : ''}
              </label>
              <input class="field__input" id="inp-fecha-turno" type="date"
                value="${todayISO}" max="${todayISO}"
                ${!canEditDate ? 'disabled' : ''}>
              ${!canEditDate ? `<span class="field__hint">Fecha de hoy asignada automáticamente</span>` : ''}
            </div>

            <!-- Aviso de fecha muy antigua -->
            <div id="fecha-ant-warn" style="display:none;background:var(--warning-bg,#2A1800);border:1px solid var(--warning);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--warning)">
              ⚠️ Estás cargando un servicio de hace más de 7 días. ¿Es correcto?
            </div>

            <!-- Aviso de turno duplicado -->
            <div id="turno-dup-warn" style="display:none;background:var(--warning-bg,#2A1800);border:1px solid var(--warning);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--warning)">
              ⚠️ <span id="turno-dup-msg"></span>
            </div>

            <div class="turno-options">
              <button class="turno-btn" data-turno="mediodia">
                <span class="turno-btn__icon">☀️</span>
                <span class="turno-btn__name">Mediodía</span>
              </button>
              <button class="turno-btn" data-turno="noche">
                <span class="turno-btn__icon">🌙</span>
                <span class="turno-btn__name">Noche</span>
              </button>
            </div>

            <!-- Panel de confirmación duplicado -->
            <div id="dup-confirm-panel" style="display:none;background:var(--surface);border:1px solid var(--warning);border-radius:var(--radius-sm);padding:14px;margin-top:12px">
              <div style="font-size:13px;color:var(--text);margin-bottom:12px" id="dup-confirm-msg"></div>
              <div style="display:flex;gap:8px">
                <button class="btn btn--primary btn--sm" id="btn-dup-ok" style="flex:1">Sí, crear de todas formas</button>
                <button class="btn btn--outline btn--sm" id="btn-dup-cancel" style="flex:1">Cancelar</button>
              </div>
            </div>
          </div>
        </div>`,
      bind() {
        document.getElementById('btn-back').onclick = () => Router.back();

        const inpFecha = document.getElementById('inp-fecha-turno');
        const dupWarn  = document.getElementById('turno-dup-warn');
        const dupMsg   = document.getElementById('turno-dup-msg');
        const dupPanel = document.getElementById('dup-confirm-panel');
        const dupConMsg= document.getElementById('dup-confirm-msg');
        let pendingTurno = null;

        // Actualizar warnings al cambiar fecha
        const checkDuplicates = () => {
          const fecha = inpFecha.value;
          const hayMed = turnoYaExiste(fecha, 'mediodia');
          const hayNoc = turnoYaExiste(fecha, 'noche');
          if (hayMed || hayNoc) {
            const names = [hayMed && 'Mediodía', hayNoc && 'Noche'].filter(Boolean).join(' y ');
            dupMsg.textContent = `Ya existe un informe de ${names} para esa fecha.`;
            dupWarn.style.display = '';
          } else {
            dupWarn.style.display = 'none';
          }
          // Marcar visualmente los botones de turno ya cerrado
          document.querySelectorAll('.turno-btn').forEach(btn => {
            const existe = turnoYaExiste(fecha, btn.dataset.turno);
            btn.style.opacity = existe ? '0.6' : '';
            const existingTag = btn.querySelector('.turno-dup-tag');
            if (existe && !existingTag) {
              const tag = document.createElement('span');
              tag.className = 'turno-dup-tag';
              tag.style.cssText = 'display:block;font-size:10px;color:var(--warning);margin-top:2px';
              tag.textContent = 'Ya cerrado';
              btn.appendChild(tag);
            } else if (!existe && existingTag) {
              existingTag.remove();
            }
          });
        };

        const antWarn = document.getElementById('fecha-ant-warn');
        const checkFechaAntigua = () => {
          const diffDays = Math.round((new Date(todayISO) - new Date(inpFecha.value)) / 86400000);
          antWarn.style.display = diffDays > 7 ? '' : 'none';
        };

        if (canEditDate) inpFecha.onchange = () => { checkDuplicates(); checkFechaAntigua(); };
        checkDuplicates();
        checkFechaAntigua();

        const crearInforme = (turno, fecha) => {
          const fechaISO = fecha + 'T' + new Date().toTimeString().slice(0, 8);
          const informe = {
            id: uid(), fecha: fechaISO, turno,
            usuarioId: Auth.user.id, usuarioNombre: Auth.user.nombre,
            estado: 'en_progreso', items: [],
            confirmedAt: null, confirmedBy: null, confirmedByNombre: null,
            ediciones: [],
          };
          DB.addInforme(informe);
          Router.replace('informe-form', { informeId: informe.id });
        };

        document.querySelectorAll('.turno-btn').forEach(btn => {
          btn.onclick = () => {
            const fecha = inpFecha.value;
            const turno = btn.dataset.turno;
            if (turnoYaExiste(fecha, turno)) {
              // Mostrar panel de confirmación de duplicado
              const label = turno === 'mediodia' ? 'Mediodía' : 'Noche';
              dupConMsg.textContent = `Ya existe un informe de ${label} confirmado para esa fecha. ¿Querés crear uno adicional de todas formas?`;
              dupPanel.style.display = '';
              pendingTurno = { turno, fecha };
              document.getElementById('btn-dup-ok').onclick = () => {
                crearInforme(pendingTurno.turno, pendingTurno.fecha);
              };
              document.getElementById('btn-dup-cancel').onclick = () => {
                dupPanel.style.display = 'none';
                pendingTurno = null;
              };
            } else {
              crearInforme(turno, fecha);
            }
          };
        });
      },
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: INFORME FORM (en_progreso)
  ═══════════════════════════════════════════════════════════════════ */
  function pageInformeForm() {
    const { informeId } = Router.params;
    const informe = DB.getInformeById(informeId);
    if (!informe) { Router.replace('ventas'); return { html: '', bind() {} }; }

    const turnoLabel = informe.turno === 'mediodia' ? '☀️ Mediodía' : '🌙 Noche';
    const fmtFecha   = iso => new Date(iso).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const totalBot   = items => items.reduce((s, i) => s + i.cantidad, 0);

    const renderItems = items => {
      if (!items.length) return `<div class="items-empty">Buscá un vino arriba para empezar a cargar</div>`;
      return items.map(item => `
        <div class="item-row" data-vid="${item.vinoId}">
          <div class="item-row__info">
            <div class="item-row__name">${item.vinoNombre} <span class="item-row__anada">${item.vinoAnada}</span></div>
            ${typeBadge(item.vinoTipo)}
          </div>
          <div class="item-row__controls">
            <button class="qty-btn qty-btn--minus" data-vid="${item.vinoId}">−</button>
            <input class="qty-input" type="number" value="${item.cantidad}" min="1" data-vid="${item.vinoId}" inputmode="numeric">
            <button class="qty-btn qty-btn--plus" data-vid="${item.vinoId}">+</button>
            <button class="item-delete" data-vid="${item.vinoId}" title="Eliminar">✕</button>
          </div>
        </div>`).join('');
    };

    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">${turnoLabel}</span>
            <span class="topbar__meta">${fmtFecha(informe.fecha)}</span>
          </header>

          <div class="informe-search-wrap">
            <div style="position:relative">
              <input class="field__input" id="inp-wine-search" type="text"
                placeholder="Buscar vino por nombre o añada…" autocomplete="off">
              <div class="autocomplete-list hidden" id="wine-ac"></div>
            </div>
            <div class="wine-selected-card hidden" id="wine-selected-card">
              <div class="wine-selected-info" id="wine-selected-info"></div>
              <div class="qty-control">
                <button class="qty-btn" id="qty-minus">−</button>
                <input class="qty-input qty-input--main" id="qty-val" type="number" value="1" min="1" inputmode="numeric">
                <button class="qty-btn" id="qty-plus">+</button>
              </div>
              <button class="btn btn--primary btn--full" id="btn-agregar">Agregar al informe</button>
            </div>
          </div>

          <div class="content" style="padding-bottom:80px">
            <div class="items-summary" id="items-summary" style="${informe.items.length ? '' : 'display:none'}">
              ${(() => {
                const tot  = totalBot(informe.items);
                const fact = informe.items.reduce((s,i) => s + ((i.vinoPrecio||0)*i.cantidad), 0);
                return `${informe.items.length} vinos · ${tot} bot.${fact > 0 ? ` · <span style="color:var(--gold)">${fmtCurrency(fact)}</span>` : ''}`;
              })()}
            </div>
            <div class="items-list" id="items-list">${renderItems(informe.items)}</div>
          </div>

          <div class="informe-footer">
            <button class="btn btn--ghost btn--sm" id="btn-cancel">Cancelar</button>
            <button class="btn btn--primary" id="btn-preview" ${!informe.items.length ? 'disabled' : ''}>
              Vista previa →
            </button>
          </div>
          <div id="cancel-confirm-panel" style="display:none;position:fixed;bottom:60px;left:0;right:0;padding:14px 16px;background:var(--surface);border-top:1px solid var(--error);z-index:30">
            <div style="font-size:13px;color:var(--text);margin-bottom:10px">¿Cancelar el informe? Los datos cargados se van a perder.</div>
            <div style="display:flex;gap:8px">
              <button class="btn btn--sm" id="btn-cancel-ok" style="flex:1;background:var(--error);border-color:var(--error);color:#fff">Sí, cancelar</button>
              <button class="btn btn--outline btn--sm" id="btn-cancel-back" style="flex:1">No, volver</button>
            </div>
          </div>
        </div>`,

      bind() {
        let selectedWine = null;
        const inpSearch  = document.getElementById('inp-wine-search');
        const acList     = document.getElementById('wine-ac');
        const selCard    = document.getElementById('wine-selected-card');
        const selInfo    = document.getElementById('wine-selected-info');
        const qtyVal     = document.getElementById('qty-val');
        const itemsList  = document.getElementById('items-list');
        const summary    = document.getElementById('items-summary');
        const btnPreview = document.getElementById('btn-preview');

        document.getElementById('btn-back').onclick = () => Router.back();

        // ── Refresh items list sin re-render completo ────────────
        const refreshItems = () => {
          const inf  = DB.getInformeById(informeId);
          const tot  = totalBot(inf.items);
          const fact = inf.items.reduce((s, i) => s + ((i.vinoPrecio || 0) * i.cantidad), 0);
          itemsList.innerHTML = renderItems(inf.items);
          summary.innerHTML = `${inf.items.length} vinos · ${tot} bot.${fact > 0 ? ` · <span style="color:var(--gold)">${fmtCurrency(fact)}</span>` : ''}`;
          summary.style.display = inf.items.length ? '' : 'none';
          btnPreview.disabled   = inf.items.length === 0;
          bindItemControls();
        };

        // ── Controls de cada ítem (qty +/- / delete) ────────────
        const bindItemControls = () => {
          itemsList.querySelectorAll('.qty-btn--minus').forEach(btn => {
            btn.onclick = () => {
              const inf  = DB.getInformeById(informeId);
              const item = inf.items.find(i => i.vinoId === btn.dataset.vid);
              if (!item || item.cantidad <= 1) return;
              item.cantidad--;
              DB.updateInforme(informeId, { items: inf.items });
              refreshItems();
            };
          });
          itemsList.querySelectorAll('.qty-btn--plus').forEach(btn => {
            btn.onclick = () => {
              const inf  = DB.getInformeById(informeId);
              const item = inf.items.find(i => i.vinoId === btn.dataset.vid);
              if (!item) return;
              item.cantidad++;
              DB.updateInforme(informeId, { items: inf.items });
              refreshItems();
            };
          });
          itemsList.querySelectorAll('.qty-input').forEach(inp => {
            inp.onchange = () => {
              const val  = Math.max(1, parseInt(inp.value) || 1);
              inp.value  = val;
              const inf  = DB.getInformeById(informeId);
              const item = inf.items.find(i => i.vinoId === inp.dataset.vid);
              if (!item) return;
              item.cantidad = val;
              DB.updateInforme(informeId, { items: inf.items });
              refreshItems();
            };
          });
          itemsList.querySelectorAll('.item-delete').forEach(btn => {
            btn.onclick = () => {
              const inf  = DB.getInformeById(informeId);
              inf.items  = inf.items.filter(i => i.vinoId !== btn.dataset.vid);
              DB.updateInforme(informeId, { items: inf.items });
              Toast.info('Ítem eliminado');
              refreshItems();
            };
          });
        };
        bindItemControls();

        // ── Autocomplete búsqueda ────────────────────────────────
        const clearSelection = () => {
          selectedWine = null;
          selCard.classList.add('hidden');
          selInfo.innerHTML = '';
          qtyVal.value = 1;
        };

        const showSelection = wine => {
          selectedWine = wine;
          const inf = DB.getInformeById(informeId);
          const yaEnInforme = inf.items.find(i => i.vinoId === wine.id);
          const stockDB   = wine.stock_actual ?? 0;
          const stockNeto = stockDB - (yaEnInforme ? yaEnInforme.cantidad : 0);
          const stockColor = stockNeto <= 0 ? 'var(--error)' : stockNeto <= 3 ? 'var(--warning)' : 'var(--success)';
          const stockLabel = stockNeto <= 0 ? '⚠️ Sin stock disponible' : `${stockNeto} bot. disponibles`;
          selInfo.innerHTML = `
            <div class="wine-sel-name">${wine.nombre} <span class="wine-sel-anada">${wine.añada}</span></div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
              ${typeBadge(wine.tipo)}
              <span style="font-size:12px;font-weight:600;color:${stockColor}">${stockLabel}</span>
              ${yaEnInforme ? `<span style="font-size:11px;color:var(--text-muted)">(${yaEnInforme.cantidad} ya en informe)</span>` : ''}
            </div>
            ${wine.precio_carta === 0 ? `<div style="font-size:11px;color:var(--warning);margin-top:3px">⚠️ Sin precio de carta asignado</div>` : ''}`;
          selCard.classList.remove('hidden');
          qtyVal.select();
        };

        inpSearch.oninput = () => {
          const q = normalize(inpSearch.value);
          if (q.length < 1) { acList.classList.add('hidden'); clearSelection(); return; }
          const activos  = DB.getWines().filter(w => w.activo !== false);
          const matches  = activos.filter(w =>
            normalize(w.nombre).includes(q) || String(w.añada).includes(q)
          ).slice(0, 8);
          if (!matches.length) { acList.classList.add('hidden'); return; }
          const infNow   = DB.getInformeById(informeId);
          const enInforme = new Set(infNow.items.map(i => i.vinoId));
          acList.innerHTML = matches.map(w =>
            `<div class="ac-item" data-id="${w.id}" style="${enInforme.has(w.id) ? 'background:var(--surface-3)' : ''}">
               <strong>${w.nombre}</strong> <span style="color:var(--text-muted)">${w.añada}</span>
               &nbsp;${typeBadge(w.tipo)}
               ${enInforme.has(w.id) ? `<span style="float:right;font-size:11px;color:var(--success);font-weight:600">✓ en informe</span>` : ''}
             </div>`
          ).join('');
          acList.classList.remove('hidden');
          acList.querySelectorAll('.ac-item').forEach(item => {
            item.onmousedown = e => {
              e.preventDefault();
              const wine = DB.getWineById(item.dataset.id);
              if (wine) { inpSearch.value = ''; acList.classList.add('hidden'); showSelection(wine); }
            };
          });
        };
        inpSearch.onblur = () => setTimeout(() => acList.classList.add('hidden'), 200);

        // ── Qty controls para selección ──────────────────────────
        document.getElementById('qty-minus').onclick = () => { qtyVal.value = Math.max(1, parseInt(qtyVal.value) - 1); };
        document.getElementById('qty-plus').onclick  = () => { qtyVal.value = parseInt(qtyVal.value) + 1; };
        qtyVal.onchange = () => { qtyVal.value = Math.max(1, parseInt(qtyVal.value) || 1); };

        // ── Agregar al informe ───────────────────────────────────
        const doAgregar = () => {
          if (!selectedWine) return;
          const qty = Math.max(1, parseInt(qtyVal.value) || 1);
          const inf = DB.getInformeById(informeId);
          const existing = inf.items.find(i => i.vinoId === selectedWine.id);
          if (existing) {
            existing.cantidad += qty;
            DB.updateInforme(informeId, { items: inf.items });
            Toast.info(`+${qty} sumado a "${selectedWine.nombre}"`);
          } else {
            inf.items.push({
              vinoId:        selectedWine.id,
              vinoNombre:    selectedWine.nombre,
              vinoAnada:     selectedWine.añada,
              vinoTipo:      selectedWine.tipo,
              vinoPrecio:    selectedWine.precio_carta || 0,  // snapshot del precio vigente
              vinoCosto:     selectedWine.costo || 0,          // snapshot del costo vigente
              cantidad:      qty,
            });
            DB.updateInforme(informeId, { items: inf.items });
            Toast.success(`"${selectedWine.nombre}" agregado`);
          }
          clearSelection();
          refreshItems();
          inpSearch.value = '';
          inpSearch.focus();
        };

        document.getElementById('btn-agregar').onclick = doAgregar;
        qtyVal.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); doAgregar(); } };

        // ── Cancelar ─────────────────────────────────────────────
        document.getElementById('btn-cancel').onclick = () => {
          document.getElementById('cancel-confirm-panel').style.display = '';
        };
        document.getElementById('btn-cancel-ok').onclick = () => {
          DB.saveInformes(DB.getInformes().filter(i => i.id !== informeId));
          Toast.info('Informe cancelado');
          Router.replace('ventas');
        };
        document.getElementById('btn-cancel-back').onclick = () => {
          document.getElementById('cancel-confirm-panel').style.display = 'none';
        };

        // ── Vista previa ─────────────────────────────────────────
        document.getElementById('btn-preview').onclick = () => {
          DB.updateInforme(informeId, { estado: 'preview' });
          Router.go('informe-preview', { informeId });
        };
      },
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: INFORME PREVIEW
  ═══════════════════════════════════════════════════════════════════ */
  function pageInformePreview() {
    const { informeId } = Router.params;
    const informe = DB.getInformeById(informeId);
    if (!informe) { Router.replace('ventas'); return { html: '', bind() {} }; }

    const turnoLabel = informe.turno === 'mediodia' ? '☀️ Mediodía' : '🌙 Noche';
    const fmtFecha   = iso => new Date(iso).toLocaleDateString('es-AR', { weekday: 'long', day: '2-digit', month: 'long' });
    const totalBot   = informe.items.reduce((s, i) => s + i.cantidad, 0);

    // Facturación estimada en preview (snapshot precio vigente)
    const totalEstimadoPrev = informe.items.reduce((s, item) => {
      const precio = item.vinoPrecio != null
        ? item.vinoPrecio
        : (DB.getWineById(item.vinoId)?.precio_carta || 0);
      return s + precio * item.cantidad;
    }, 0);

    // Agrupar por tipo, ordenados por el orden canónico + dentro de cada grupo alfa
    const types  = DB.getWineTypes();
    const groups = {};
    types.forEach(t => { groups[t] = []; });
    informe.items.forEach(item => {
      if (!groups[item.vinoTipo]) groups[item.vinoTipo] = [];
      groups[item.vinoTipo].push(item);
    });
    Object.keys(groups).forEach(t => groups[t].sort((a, b) => a.vinoNombre.localeCompare(b.vinoNombre, 'es')));

    const groupsHTML = Object.entries(groups)
      .filter(([, items]) => items.length > 0)
      .map(([tipo, items]) => {
        const c = WINE_COLORS[tipo] || { bg: '#6A5050' };
        return `
          <div class="preview-group">
            <div class="preview-group__label" style="background:${c.bg};color:#fff">${tipo}</div>
            <div class="preview-group__items">
              ${items.map(item => {
                const wine     = DB.getWineById(item.vinoId);
                const stockWarn = wine && item.cantidad > (wine.stock_actual || 0);
                return `<div class="preview-item">
                  <div class="preview-item__name">${item.vinoNombre} <span class="preview-item__anada">${item.vinoAnada}</span></div>
                  <div class="preview-item__right">
                    ${stockWarn ? `<span class="preview-warn" title="${wine.stock_actual === 0 ? 'Sin stock disponible' : `Supera el stock: ${wine.stock_actual} bot.`}">⚠️</span>` : ''}
                    <span class="preview-item__qty">× ${item.cantidad}</span>
                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>`;
      }).join('');

    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">Vista previa</span>
            <span></span>
          </header>
          <div class="content" style="padding-bottom:90px">
            <div class="preview-meta">
              <div class="preview-meta__turno">${turnoLabel}</div>
              <div class="preview-meta__fecha">${fmtFecha(informe.fecha)}</div>
              <div class="preview-meta__user">Cargado por ${informe.usuarioNombre}</div>
            </div>
            <div class="preview-groups">${groupsHTML}</div>
            <div class="preview-total">
              <span class="preview-total__label">Total</span>
              <span class="preview-total__value">${totalBot} botellas</span>
            </div>
            ${totalEstimadoPrev > 0 ? `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface);border-radius:var(--radius-sm);margin-top:4px;border:1px solid var(--border)">
              <span style="font-size:13px;color:var(--text-muted)">Facturación estimada</span>
              <span style="font-size:16px;font-weight:700;color:var(--gold-light)">${fmtCurrency(totalEstimadoPrev)}</span>
            </div>` : ''}
          </div>
          <div class="informe-footer">
            <button class="btn btn--secondary" id="btn-edit">← Editar</button>
            <button class="btn btn--primary" id="btn-confirm">Confirmar ✓</button>
          </div>
        </div>`,
      bind() {
        const goBack = () => {
          DB.updateInforme(informeId, { estado: 'en_progreso' });
          Router.back();
        };
        document.getElementById('btn-back').onclick  = goBack;
        document.getElementById('btn-edit').onclick  = goBack;

        document.getElementById('btn-confirm').onclick = () => {
          if (!informe.items.length) { Toast.error('No podés confirmar un informe vacío'); return; }

          // Descontar stock y registrar movimientos
          informe.items.forEach(item => {
            const wine = DB.getWineById(item.vinoId);
            if (wine) {
              DB.updateWine(wine.id, { stock_actual: Math.max(0, (wine.stock_actual || 0) - item.cantidad) });
              DB.addMovement({
                wineId:   wine.id,
                tipo:     'salida',
                cantidad: item.cantidad,
                userId:   Auth.user.id,
                userName: Auth.user.nombre,
                nota:     `Informe ${informe.turno === 'mediodia' ? 'Mediodía' : 'Noche'} · ${fmtDate(informe.fecha)}`,
              });
            }
          });

          DB.updateInforme(informeId, {
            estado: 'confirmado', confirmedAt: now(),
            confirmedBy: Auth.user.id, confirmedByNombre: Auth.user.nombre,
          });
          Toast.success('Informe confirmado ✓');
          Router.replace('informe-detail', { id: informeId, fromConfirm: true });
        };
      },
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     PAGE: INFORME DETAIL (confirmado)
  ═══════════════════════════════════════════════════════════════════ */
  function pageInformeDetail() {
    const { id, fromConfirm } = Router.params;
    const informe = DB.getInformeById(id);
    if (!informe) { Router.replace('ventas'); return { html: '', bind() {} }; }

    const turnoLabel  = informe.turno === 'mediodia' ? '☀️ Mediodía' : '🌙 Noche';
    const fmtFecha    = iso => new Date(iso).toLocaleDateString('es-AR', { weekday: 'long', day: '2-digit', month: 'long' });
    const fmtDateTime = iso => new Date(iso).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    const totalBot    = informe.items.reduce((s, i) => s + i.cantidad, 0);
    const canEdit     = Auth.can('edit_closed_shift');

    // Facturación estimada: usa vinoPrecio (snapshot) si existe, fallback al precio actual del vino
    const totalEstimado = informe.items.reduce((s, item) => {
      const precio = item.vinoPrecio != null
        ? item.vinoPrecio
        : (DB.getWineById(item.vinoId)?.precio_carta || 0);
      return s + precio * item.cantidad;
    }, 0);
    const hayPreciosEstimados = informe.items.some(i => i.vinoPrecio != null || DB.getWineById(i.vinoId)?.precio_carta > 0);

    const types  = DB.getWineTypes();
    const groups = {};
    types.forEach(t => { groups[t] = []; });
    informe.items.forEach(item => {
      if (!groups[item.vinoTipo]) groups[item.vinoTipo] = [];
      groups[item.vinoTipo].push(item);
    });
    Object.keys(groups).forEach(t => groups[t].sort((a, b) => a.vinoNombre.localeCompare(b.vinoNombre, 'es')));

    // Resumen por estilo
    const resumenEstilosHTML = Object.entries(groups)
      .filter(([, items]) => items.length > 0)
      .map(([tipo, items]) => {
        const c    = WINE_COLORS[tipo] || { bg: '#6A5050' };
        const bots = items.reduce((s, i) => s + i.cantidad, 0);
        return `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
            <span class="badge badge--type"><span class="type-dot" style="background:${c.bg}"></span>${tipo}</span>
            <span style="font-weight:700;color:var(--text)">${bots} bot.</span>
          </div>`;
      }).join('');

    const groupsHTML = Object.entries(groups)
      .filter(([, items]) => items.length > 0)
      .map(([tipo, items]) => {
        const c = WINE_COLORS[tipo] || { bg: '#6A5050' };
        const tipoBots = items.reduce((s, i) => s + i.cantidad, 0);
        return `
          <div class="preview-group">
            <div class="preview-group__label" style="background:${c.bg};color:#fff;display:flex;justify-content:space-between;align-items:center">
              <span>${tipo}</span>
              <span style="font-size:12px;opacity:0.85">${tipoBots} bot.</span>
            </div>
            <div class="preview-group__items">
              ${items.map(item => `
                <div class="preview-item">
                  <div class="preview-item__name">${item.vinoNombre} <span class="preview-item__anada">${item.vinoAnada}</span></div>
                  <span class="preview-item__qty">× ${item.cantidad}</span>
                </div>`).join('')}
            </div>
          </div>`;
      }).join('');

    const edicionesHTML = informe.ediciones?.length ? `
      <section class="section">
        <h3 class="section__title">Ediciones post-confirmación</h3>
        <div class="mov-list">
          ${informe.ediciones.map(e => `
            <div class="mov-item">
              <div class="mov-item__info">
                <span class="mov-item__type">${e.nota}</span>
                <span class="mov-item__user">${e.userName} · ${fmtDateTime(e.fecha)}</span>
              </div>
            </div>`).join('')}
        </div>
      </section>` : '';

    return {
      html: `
        <div class="screen">
          <header class="topbar">
            <button class="topbar__back" id="btn-back">←</button>
            <span class="topbar__title">${turnoLabel}</span>
            ${canEdit ? `<button class="topbar__action" id="btn-reabrir">Editar</button>` : '<span></span>'}
          </header>
